name: 'Сервер: обновить'

# Все пакеты Ubuntu (обновления безопасности ставятся и сами, каждую
# ночь) и образы набора по версиям из infra/lite/compose.yml.
# Перезагрузка — только если её просит система и стоит отметка.

on:
  workflow_dispatch:
    inputs:
      reboot:
        description: 'Перезагрузить, если система просит (сайт без входа на 1–2 минуты)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  update:
    name: Обновить сервер
    runs-on: ubuntu-24.04
    # Ключи сервера — в окружении server (Settings → Environments): оно
    # пускает только ветку main и, если включено, ждёт подтверждения.
    environment: server
    timeout-minutes: 30
    steps:
      # На сервер уезжает код той ветки, с которой нажата кнопка, —
      # поэтому только main.
      - name: Только из main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Эту кнопку можно нажимать только для ветки main (сейчас: $GITHUB_REF_NAME). Сначала влейте изменения в main."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Обновить
        env:
          REBOOT: ${{ inputs.reboot && '1' || '' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: infra/lite/actions/update.sh

      - name: Здоровье после обновления
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          API_DOMAIN: ${{ vars.API_DOMAIN || 'api.budetege.ru' }}
        run: infra/lite/actions/health.sh

      - name: Письмо о сбое
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@budetege.ru' }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: infra/lite/actions/notify.sh '«Обновить» не прошло'
