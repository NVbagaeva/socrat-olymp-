name: 'Сервер: проверить здоровье'

# Снаружи: отвечает ли https://api.budetege.ru с настоящим сертификатом
# и на месте ли записи почты в DNS (SPF и DKIM — иначе письма
# подтверждения уходят в спам; про DMARC — замечание).
# Изнутри (bin/health.sh): контейнеры, API, срок сертификата, диск,
# память, свежесть ночной копии. Каждые 30 минут по расписанию и
# кнопкой. Сбой — письмо на ALERT_EMAIL (и уведомление GitHub).
#
# Сам сервер раз в 15 минут проверяет то же и пишет о проблемах сам;
# эта проверка нужна на случай, когда сервер не может написать —
# выключен или недоступен.

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

jobs:
  health:
    name: Проверить здоровье
    runs-on: ubuntu-24.04
    # Ключи сервера — в окружении server (Settings → Environments): оно
    # пускает только ветку main и, если включено, ждёт подтверждения.
    environment: server
    timeout-minutes: 10
    # Расписание — только когда сервер уже подготовлен.
    if: github.event_name == 'workflow_dispatch' || vars.SERVER_READY == '1'
    steps:
      # На сервер уезжает код той ветки, с которой нажата кнопка, —
      # поэтому только main.
      - name: Только из main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Эту кнопку можно нажимать только для ветки main (сейчас: $GITHUB_REF_NAME). Сначала влейте изменения в main."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Проверить
        id: health
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          API_DOMAIN: ${{ vars.API_DOMAIN || 'api.budetege.ru' }}
          # Домен отправителя писем и селектор DKIM — для проверки SPF,
          # DKIM и DMARC в DNS.
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@budetege.ru' }}
          DKIM_SELECTOR: ${{ vars.DKIM_SELECTOR || 'mail' }}
        run: infra/lite/actions/health.sh

      - name: Письмо о сбое
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@budetege.ru' }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: infra/lite/actions/notify.sh 'Сервер нездоров' "$RUNNER_TEMP/budetege-lite/health.txt"
