name: Deploy

# Публикуем сайт при каждом изменении в main.
# Ручной запуск оставлен на случай, когда нужно перезалить сборку без нового коммита.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Два деплоя одновременно затёрли бы файл состояния на сервере,
# поэтому новый запуск ждёт, пока закончится предыдущий.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Сборка и публикация на FTP
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm ставим до setup-node: иначе кэшу нечего искать.
      # Версия берётся из поля packageManager в app/package.json.
      - name: Установить pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      # Кэш зависимостей настроен здесь и только здесь. setup-node@v5
      # умеет включать его сам по полю packageManager, но лишь когда
      # входа cache нет; он задан — значит, автокэш не подключается и
      # два механизма не спорят за один ключ. В шаге установки pnpm
      # входа cache нет, дублировать нечего.
      - name: Установить Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Поставить зависимости
        working-directory: app
        run: pnpm install --frozen-lockfile

      # next.config.ts собран с output: 'export' — результат складывается в app/out.
      - name: Собрать статический экспорт
        working-directory: app
        run: pnpm build

      - name: Проверить, что экспорт не пустой
        run: test -f app/out/index.html

      # Порядок заливки: сначала файлы сборки (_next), потом страницы.
      # Иначе в окне между шагами новая страница ссылалась бы на файлы,
      # которых на сервере ещё нет.
      #
      # _next заливается без удаления: открытая у ученика вкладка
      # прошлой версии догружает свои куски кода по старым именам, и
      # удалить их — значит сломать ей переход. Имена в _next собраны
      # по содержимому, поэтому заливаются только новые файлы
      # (--only-missing), а старые остаются. Чистить их — отдельной
      # задачей, когда понадобится.
      #
      # lftp, а не действие ниже: действие синхронизирует папку и
      # удаляет с сервера то, что исчезло из сборки. Пароль передаётся
      # через окружение (--env-password), в командную строку не
      # попадает. Подключение незашифрованное — как и у действия ниже,
      # это ограничение хостинга (docs/DEPLOYMENT.md).
      - name: Залить файлы сборки (_next) — только новые, без удаления
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lftp
          lftp --env-password -u "$FTP_USERNAME" -p 21 "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --only-missing --no-perms --parallel=4 app/out/_next/ /public_html/_next/;
            bye"

      - name: Залить страницы на FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Timeweb, shared-хостинг: сервер не поддерживает FTP через TLS
          # вообще — проверено клиентом FileZilla, авторизация проходит,
          # но соединение помечено как незащищённое. Ни ftps (явный TLS),
          # ни ftps-legacy (implicit TLS) поэтому не подходят.
          # Внимание: пароль уходит на сервер открытым текстом.
          protocol: ftp
          # Порт указан явно, хотя 21 у действия и так по умолчанию:
          # пусть режим подключения читается целиком, без догадок.
          port: 21
          local-dir: ./app/out/
          server-dir: /public_html/
          # Чужие файлы действие не трогает: удаляет оно только то, что
          # само залило раньше и что исчезло из новой сборки (по своему
          # файлу состояния .ftp-deploy-sync-state.json).
          # dangerous-clean-slate — единственный режим действия, который стирает
          # содержимое папки на сервере перед загрузкой. Он выключен явно,
          # чтобы случайно не удалить ege/, about.html и остальные рабочие страницы.
          dangerous-clean-slate: false
          # _next залит шагом выше. Исключённое действие и не заливает,
          # и не удаляет. Первые три строки — исключения действия по
          # умолчанию: заданный список их заменяет, поэтому они повторены.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            _next/**
            **/_next/**
