name: PDF 8

# Собирает сборник «Задание 8. Вычисления и преобразования» и отдаёт готовые
# файлы. Нужен затем, чтобы PDF можно было получить, ничего не
# устанавливая у себя: Chromium и Playwright живут здесь.
#
# Этот же workflow приводит в порядок pnpm-lock.yaml. Playwright
# объявлен в devDependencies, но обновить lock-файл там, где его
# добавляли, было нельзя: у песочницы нет доступа к реестру npm.
# Поэтому install идёт с --no-frozen-lockfile, а обновлённый lock
# коммитится обратно в ветку — после этого обычные check.yml
# и deploy.yml снова проходят со --frozen-lockfile.
#
# Триггеров два, и push здесь главный. Кнопка «Run workflow»
# появляется в Actions только тогда, когда файл workflow лежит
# в ветке по умолчанию, — до слияния в main её не будет вовсе.
# А push-триггер работает из любой ветки сразу, поэтому сборка
# запускается сама, без кнопки и без правок main.

on:
  push:
    branches: ['claude/pdf-task-8-**', 'claude/task-08-**']
    paths:
      - 'app/package.json'
      - 'app/src/lib/sheet/**'
      - 'app/src/lib/vychisleniya/**'
      - 'app/src/content/sheet8.js'
      - 'app/scripts/build-pdf-8.mjs'
      - 'app/scripts/lib/sheet-render.mjs'
      - '.github/workflows/pdf-8.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Что собирать
        type: choice
        default: full
        options: [full, sample]

# Коммит lock-файла и готовых PDF — это push в ту же ветку.
permissions:
  contents: write

concurrency:
  group: pdf-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка PDF
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      - name: Установить pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      # Кэш зависимостей настроен здесь и только здесь. setup-node@v5
      # умеет включать его сам по полю packageManager, но лишь когда
      # входа cache нет; он задан — значит, автокэш не подключается и
      # два механизма не спорят за один ключ. В шаге установки pnpm
      # входа cache нет, дублировать нечего.
      - name: Установить Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Именно --no-frozen-lockfile: со --frozen-lockfile pnpm
      # не обновляет lock-файл, а отказывается ставить.
      - name: Поставить зависимости и обновить lock-файл
        working-directory: app
        run: pnpm install --no-frozen-lockfile

      # Lock-файл коммитится сразу, до сборки: даже если печать
      # упадёт, ветка останется в рабочем состоянии.
      #
      # Своим push этот шаг сам себя не вызовет: события от
      # GITHUB_TOKEN новых запусков не создают. [skip ci] в сообщении —
      # вторая страховка на случай, если ветку будут толкать руками.
      - name: Вернуть обновлённый lock-файл в ветку
        run: |
          if git diff --quiet -- app/pnpm-lock.yaml; then
            echo "lock-файл не менялся"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pnpm-lock.yaml
          git commit -m "pnpm-lock.yaml: playwright для сборки PDF [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      # Браузер ставится отдельной командой, а не постустановочным
      # скриптом пакета: pnpm 10 их не запускает, если пакета нет
      # в onlyBuiltDependencies.
      - name: Поставить Chromium
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Проверить генераторы и банк задания №8
        working-directory: app
        run: pnpm test:vychisleniya

      # Сборка сайта и проверка утечки ответов. Их делает и check.yml,
      # но он срабатывает только на pull_request, а этой ветке таких
      # событий не досталось: PR открыт приложением, и прогон
      # не создался. Без этих двух шагов правки в движке и новые
      # модули шаблона остались бы вообще не собранными — ни здесь,
      # ни там. Шаги дешёвые, дублирование тут честнее пробела.
      - name: Собрать сайт
        working-directory: app
        run: pnpm build

      - name: Проверить, что ответов нет в сборке
        working-directory: app
        run: pnpm test:secrets

      # По push собирается весь сборник: это и есть предмет работы.
      # Кнопкой можно попросить только образец — на нём быстрее
      # смотреть оформление.
      - name: Собрать PDF
        working-directory: app
        run: |
          if [ "${{ inputs.target }}" = "sample" ]; then
            pnpm build:pdf-8-sample
          else
            pnpm build:pdf-8
          fi

      # Проверка идёт по готовым файлам и по отчёту сборки: состав,
      # сквозная нумерация, ответы против движка, формулы, вшитые
      # шрифты, отсутствие цвета в ч/б, ссылки, заглушки.
      - name: Проверить сборник
        if: ${{ inputs.target != 'sample' }}
        working-directory: app
        run: pnpm test:pdf-8

      # Архив — единственный путь к файлам с ответами: в репозиторий
      # они не ложатся, репозиторий публичный. Файлы без ответов
      # едут и здесь, и коммитом ниже.
      #
      # Папка pdf-private намеренно без точки в начале: скрытые
      # файлы upload-artifact по умолчанию пропускает.
      - name: Отдать файлы архивом
        uses: actions/upload-artifact@v4
        with:
          name: zadanie-8-pdf
          path: |
            app/public/materials/zadanie-8/*.pdf
            app/pdf-private/*.pdf
          if-no-files-found: error
          retention-days: 90

      # Коммит в ветку — чтобы файлы лежали там, откуда их отдаёт
      # сайт (/materials/...), и не пропадали вместе с архивом.
      # Собирать их может только CI: KaTeX требует установленных
      # зависимостей, а песочница до реестра npm не доходит.
      #
      # Добавляется ровно папка public: файлы с ответами лежат
      # в pdf-private, её закрывает .gitignore, и сюда они попасть
      # не могут. Это же проверяет pnpm test:pdf-8 выше — шагом
      # раньше, чем дело дойдёт до коммита.
      - name: Вернуть готовые PDF в ветку
        if: ${{ inputs.target != 'sample' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/materials/zadanie-8
          # Сравнивать надо индекс, а не рабочее дерево: файлы могут
          # быть новыми, а git diff неотслеживаемых не видит и молча
          # сообщает, что менять нечего.
          if git diff --cached --quiet -- app/public/materials/zadanie-8; then
            echo "файлы не менялись"
            exit 0
          fi
          git commit -m "Сборник №8: пересобранные PDF [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
