name: 'Сервер: копия сейчас'

# Внеочередная копия базы — та же, что каждую ночь в 03:30 по Москве:
# pg_dump, шифрование, Yandex Object Storage (daily/, и weekly/, если
# за неделю ещё не было).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  backup:
    name: Копия базы
    runs-on: ubuntu-24.04
    # Ключи сервера — в окружении server (Settings → Environments): оно
    # пускает только ветку main и, если включено, ждёт подтверждения.
    environment: server
    timeout-minutes: 30
    steps:
      # На сервер уезжает код той ветки, с которой нажата кнопка, —
      # поэтому только main.
      - name: Только из main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Эту кнопку можно нажимать только для ветки main (сейчас: $GITHUB_REF_NAME). Сначала влейте изменения в main."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Копия
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: infra/lite/actions/backup.sh

      - name: Письмо о сбое
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@budetege.ru' }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: infra/lite/actions/notify.sh '«Копия сейчас» не прошла'
