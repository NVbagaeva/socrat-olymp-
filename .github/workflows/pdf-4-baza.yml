name: PDF 4 база

# Собирает печатную базу «Задание 4»: все прототипы тренажёра
# с вариантами 1–10, два файла — ученику и учителю. По образцу
# pdf-4.yml и pdf-12.yml: Chromium и Playwright живут здесь, поэтому
# PDF можно получить, ничего не устанавливая у себя.
#
# Как и pdf-4.yml, приводит в порядок pnpm-lock.yaml: install идёт
# с --no-frozen-lockfile, обновлённый lock коммитится обратно в ветку.
#
# Триггеров два, и push здесь главный: кнопка «Run workflow»
# появляется только после того, как файл workflow окажется в ветке
# по умолчанию, а push-триггер работает из любой ветки сразу.

on:
  push:
    branches: ['claude/zadanie-4-print-base-**']
    paths:
      - 'app/package.json'
      - 'app/src/lib/sheet/**'
      - 'app/src/lib/veroyatnost/**'
      - 'app/src/content/sheet4-baza.js'
      - 'app/src/content/sheet12.js'
      - 'app/src/content/veroyatnost.ts'
      - 'app/scripts/build-pdf-4-baza.mjs'
      - 'app/scripts/check-pdf-4-baza.mjs'
      - 'app/scripts/lib/**'
      - '.github/workflows/pdf-4-baza.yml'
  workflow_dispatch:

# Коммит lock-файла и готового PDF — это push в ту же ветку.
permissions:
  contents: write

concurrency:
  group: pdf-4-baza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка PDF
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      - name: Установить pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      # Кэш зависимостей настроен здесь и только здесь — см. pdf-4.yml.
      - name: Установить Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # Именно --no-frozen-lockfile: со --frozen-lockfile pnpm
      # не обновляет lock-файл, а отказывается ставить.
      - name: Поставить зависимости и обновить lock-файл
        working-directory: app
        run: pnpm install --no-frozen-lockfile

      # Lock-файл коммитится сразу, до сборки: даже если печать
      # упадёт, ветка останется в рабочем состоянии. Своим push
      # этот шаг сам себя не вызовет: события от GITHUB_TOKEN новых
      # запусков не создают; [skip ci] — вторая страховка.
      - name: Вернуть обновлённый lock-файл в ветку
        run: |
          if git diff --quiet -- app/pnpm-lock.yaml; then
            echo "lock-файл не менялся"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pnpm-lock.yaml
          git commit -m "pnpm-lock.yaml: playwright для сборки PDF [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      # Браузер ставится отдельной командой: pnpm 10 не запускает
      # постустановочные скрипты пакетов вне onlyBuiltDependencies.
      - name: Поставить Chromium
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Проверить банк заданий №4 и №5
        working-directory: app
        run: pnpm test:veroyatnost

      - name: Собрать PDF
        working-directory: app
        run: pnpm build:pdf-4-baza

      # Проверка идёт по готовым файлам и по отчёту сборки: состав
      # (каждый прототип — варианты 1–10 подряд), сквозная нумерация,
      # ответы против банка, формулы, вшитые шрифты, ссылки, и отсутствие
      # ответов в файле для ученика — в карточках и заголовке PDF.
      - name: Проверить базу
        working-directory: app
        run: pnpm test:pdf-4-baza

      # Архив — единственный путь к файлу с ответами: в репозиторий
      # он не ложится, репозиторий публичный. Файл ученика едет
      # и здесь, и коммитом ниже.
      #
      # Папка pdf-private намеренно без точки в начале: скрытые
      # файлы upload-artifact по умолчанию пропускает.
      - name: Отдать файлы архивом
        uses: actions/upload-artifact@v4
        with:
          name: zadanie-4-baza-pdf
          path: |
            app/public/materials/zadanie-4/Zadanie_4_baza_uchenik.pdf
            app/pdf-private/Zadanie_4_baza_uchitel.pdf
          if-no-files-found: error
          retention-days: 90

      # Коммит в ветку — чтобы файл лежал там, откуда его отдаёт сайт
      # (/materials/...). Добавляется ровно файл ученика: файл с
      # ответами лежит в pdf-private, её закрывает .gitignore, и сюда
      # он попасть не может. Это же проверяет pnpm test:pdf-4-baza выше.
      - name: Вернуть готовый PDF в ветку
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/materials/zadanie-4/Zadanie_4_baza_uchenik.pdf
          # Сравнивать надо индекс, а не рабочее дерево: файл может
          # быть новым, а git diff неотслеживаемых не видит.
          if git diff --cached --quiet -- app/public/materials/zadanie-4; then
            echo "файл не менялся"
            exit 0
          fi
          git commit -m "База №4: пересобранный PDF [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
