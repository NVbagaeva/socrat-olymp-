name: 'Сервер: развернуть'

# Набор infra/lite на сервер: файлы, окружение из Secrets и Variables,
# docker compose pull и up. Запускать после «Подготовить сервер» и
# после каждого изменения infra/lite/ или supabase/templates/.
# Данные базы не трогаются.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    name: Развернуть набор
    runs-on: ubuntu-24.04
    # Ключи сервера — в окружении server (Settings → Environments): оно
    # пускает только ветку main и, если включено, ждёт подтверждения.
    environment: server
    timeout-minutes: 20
    steps:
      # На сервер уезжает код той ветки, с которой нажата кнопка, —
      # поэтому только main.
      - name: Только из main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Эту кнопку можно нажимать только для ветки main (сейчас: $GITHUB_REF_NAME). Сначала влейте изменения в main."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Развернуть
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          API_DOMAIN: ${{ vars.API_DOMAIN || 'api.budetege.ru' }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://budetege.ru' }}
          SITE_ORIGIN_2: ${{ vars.SITE_ORIGIN_2 || 'https://www.budetege.ru' }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@budetege.ru' }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: infra/lite/actions/deploy.sh

      - name: Письмо о сбое
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@budetege.ru' }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: infra/lite/actions/notify.sh '«Развернуть» не прошло'
