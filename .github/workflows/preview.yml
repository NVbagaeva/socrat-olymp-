name: Preview

# Снимки страниц к каждому pull request.
#
# Превью-сборки у проекта нет: сайт выкладывается только из main,
# и посмотреть правку раньше слияния было негде. Здесь сборка
# поднимается прямо в прогоне, страницы снимаются на трёх ширинах,
# снимки складываются в отдельную ветку previews и показываются
# картинками в комментарии к pull request — с телефона это открывается
# там же, где лежит сам pull request.
#
# Ветка previews к сайту отношения не имеет и в main не вливается.
# Каждый прогон переписывает её одним коммитом без истории, поэтому
# репозиторий не растёт от снимка к снимку.
#
# Право записать ветку и оставить комментарий есть только у заданий
# publish и cleanup; код из pull request с ним не выполняется. Для копий
# репозитория GitHub выдаёт токен только на чтение, и публикация там
# просто не сработает.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# Права по умолчанию — только чтение: код из pull request (установка
# пакетов, сборка, снимки) выполняется в задании shots с ними. Запись
# ветки previews и комментарий — в задании publish, которое кода из
# pull request не запускает: оно берёт готовые снимки артефактом, а
# скрипт комментария — из main.
permissions:
  contents: read

# Новый пуш в pull request отменяет прошлый прогон: снимки прошлой
# версии всё равно некому смотреть.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Эта сборка не публикуется, поэтому правовые документы можно собрать
# черновиком, с незаполненными [ФИО], [ПОЧТА], [ДАТА]. deploy.yml
# переменную не ставит: там сборка падает, пока не заполнен
# app/src/content/legal/operator.json (scripts/lib/legal-config.mjs).
env:
  LEGAL_DRAFT: '1'

jobs:
  shots:
    name: Снимки страниц
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # pnpm ставим до setup-node: иначе кэшу нечего искать.
      - name: Установить pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - name: Установить Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Поставить зависимости
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Браузер ставится отдельной командой, а не постустановочным
      # скриптом пакета: pnpm 10 их не запускает, если пакета нет
      # в onlyBuiltDependencies.
      - name: Поставить Chromium
        working-directory: app
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/apt-mirror.sh" || true
          pnpm exec playwright install --with-deps chromium

      # OFERTA_PREVIEW=1 собирает черновик оферты /oferta/ (закрыт от
      # поиска): его можно снять строкой «превью: /oferta/». В сборке
      # для хостинга его нет, пока не включён NEXT_PUBLIC_LEGAL_READY.
      - name: Собрать статический экспорт
        working-directory: app
        env:
          OFERTA_PREVIEW: '1'
        run: pnpm build

      # Строка «превью: /адрес/» в описании pull request добавляет
      # страницу к списку по умолчанию. Описание приходит через
      # переменную окружения, а не подстановкой в команду: в нём
      # может оказаться что угодно, вплоть до кавычек и переводов строк.
      - name: Выбрать страницы из описания
        id: puti
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          puti=$(printf '%s' "${PR_BODY:-}" \
            | grep -oE '([Пп]ревью|[Pp]review)[[:space:]]*:[[:space:]]*/[a-zA-Z0-9/_-]*' \
            | sed -E 's|.*:[[:space:]]*||' \
            | tr '\n' ' ' || true)
          echo "puti=${puti}" >> "$GITHUB_OUTPUT"
          echo "Дополнительные страницы: ${puti:-нет}"

      - name: Снять страницы
        working-directory: app
        env:
          PREVIEW_PATHS: ${{ steps.puti.outputs.puti }}
        run: node scripts/preview-shots.mjs "${RUNNER_TEMP}/shots"

      # Снимки нужны и сами по себе: артефакт живёт независимо
      # от ветки и годится, когда комментарий перезаписан.
      - name: Сохранить снимки артефактом
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/shots
          retention-days: 14

  publish:
    name: Опубликовать снимки
    needs: shots
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Забрать снимки
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/shots

      - name: Положить снимки в ветку previews
        id: publish
        env:
          PR: ${{ github.event.pull_request.number }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          work="${RUNNER_TEMP}/previews"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Ветка одна на все открытые pull request, и соседний прогон
          # может успеть записать её первым. Поэтому ветка не
          # перезаписывается вслепую: push проходит, только если она
          # осталась той же, что была прочитана. Не осталась — читаем
          # заново и собираем дерево поверх свежего.
          for popytka in 1 2 3; do
            rm -rf "$work"
            mkdir -p "$work"
            cd "$work"
            git init -q
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git remote add origin "$remote"

            # Ветки может ещё не быть — тогда начинаем с пустой папки,
            # а замок требует, чтобы её не было и на сервере.
            if git fetch -q --depth 1 origin previews; then
              git checkout -q FETCH_HEAD -- .
              zamok="previews:$(git rev-parse FETCH_HEAD)"
            else
              zamok='previews:'
            fi

            # Прошлые снимки этого pull request не нужны: комментарий
            # всё равно показывает только текущие.
            rm -rf "pr-${PR}"
            mkdir -p "pr-${PR}/${short}"
            cp "${RUNNER_TEMP}/shots"/*.jpg "pr-${PR}/${short}/"
            git add -A
            # Коммит без родителя: в ветке всегда ровно один коммит,
            # и вес репозитория не растёт от прогона к прогону.
            git commit -q -m "Снимки pull request #${PR}, ${short}"

            if git push -q --force-with-lease="$zamok" origin HEAD:previews; then
              echo "papka=pr-${PR}/${short}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Ветку previews успел записать соседний прогон, попытка ${popytka} из 3"
          done
          echo 'Не вышло записать ветку previews: она меняется быстрее, чем мы пишем.'
          exit 1

      - name: Оставить комментарий со снимками
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
          SHOTS_BASE: >-
            https://raw.githubusercontent.com/${{ github.repository }}/previews/${{ steps.publish.outputs.papka }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        # Скрипт — из main, а не из pull request: здесь токен с правом записи.
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github.raw' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/app/scripts/preview-comment.mjs?ref=main" \
            -o "${RUNNER_TEMP}/preview-comment.mjs"
          node "${RUNNER_TEMP}/preview-comment.mjs"

  cleanup:
    name: Убрать снимки закрытого pull request
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Стереть папку в ветке previews
        env:
          PR: ${{ github.event.pull_request.number }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/previews"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Замок и повтор — по той же причине, что и при записи снимков.
          for popytka in 1 2 3; do
            rm -rf "$work"
            mkdir -p "$work"
            cd "$work"
            git init -q
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git remote add origin "$remote"

            if ! git fetch -q --depth 1 origin previews; then
              echo 'Ветки previews нет — стирать нечего.'
              exit 0
            fi
            git checkout -q FETCH_HEAD -- .
            zamok="previews:$(git rev-parse FETCH_HEAD)"

            if [ ! -d "pr-${PR}" ]; then
              echo "Снимков pull request #${PR} в ветке нет."
              exit 0
            fi
            rm -rf "pr-${PR}"
            git add -A
            git commit -q -m "Снимки pull request #${PR} больше не нужны"

            if git push -q --force-with-lease="$zamok" origin HEAD:previews; then
              exit 0
            fi
            echo "Ветку previews успел записать соседний прогон, попытка ${popytka} из 3"
          done
          echo 'Не вышло почистить ветку previews.'
          exit 1
