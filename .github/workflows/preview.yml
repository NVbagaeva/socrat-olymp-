name: Preview

# Служебный workflow: собирает статический экспорт и кладёт его
# артефактом, чтобы сборку можно было открыть в браузере там, где
# реестр пакетов недоступен. Срабатывает только на своей ветке,
# ничего никуда не публикует и секретов не трогает.
on:
  push:
    branches: [claude/build-preview]

permissions:
  contents: write

jobs:
  build:
    name: Сборка для просмотра
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Поставить зависимости
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Собрать статический экспорт
        working-directory: app
        run: pnpm build

      - name: Проверить, что экспорт не пустой
        run: test -f app/out/index.html

      # Артефакты качаются с хранилища, которое из среды разработки
      # закрыто политикой сети. Поэтому сборка кладётся в отдельную
      # ветку: git оттуда доступен.
      # Живой сайт из среды разработки закрыт сетевой политикой,
      # а с раннера он виден. Смотрим, что там на самом деле лежит.
      - name: Посмотреть живой сайт
        run: |
          for u in \
            https://budetege.ru/zadaniya/12/linear/trenazher/value/ \
            https://budetege.ru/ ; do
            echo "=== $u"
            curl -sI "$u" | grep -iE 'HTTP/|cache-control|expires|last-modified' || true
          done
          echo "=== сам .htaccess отдаётся наружу?"
          curl -s -o /dev/null -w 'код ответа: %{http_code}\n' https://budetege.ru/.htaccess

      - name: Положить сборку в служебную ветку
        run: |
          cd app/out
          git init -q
          git config user.email noreply@anthropic.com
          git config user.name "Preview build"
          git add -A
          git commit -q -m "Сборка $GITHUB_SHA"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/claude/build-out
