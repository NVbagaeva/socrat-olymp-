name: Check

# Проверяем сборку до слияния, а не после.
# Ничего никуда не публикуем: секреты FTP этому workflow не нужны
# и намеренно не используются. Публикацией занимается deploy.yml,
# он срабатывает отдельно, только при push в main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Если в открытый pull request пушат несколько раз подряд,
# старая проверка отменяется: ждать её результата смысла нет.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Эта сборка не публикуется, поэтому правовые документы можно собрать
# черновиком, с незаполненными [ФИО], [ПОЧТА], [ДАТА]. deploy.yml
# переменную не ставит: там сборка падает, пока не заполнен
# app/src/content/legal/operator.json (scripts/lib/legal-config.mjs).
env:
  LEGAL_DRAFT: "1"

jobs:
  # Проверки идут параллельно на нескольких машинах GitHub, а не
  # одной очередью (так было около двух часов). Задания:
  #   • «Проверки без сборки (1–3)» — автотесты банков, генераторов,
  #     движков, правил согласий; сайт для них не собирается;
  #   • «Сборка» — статический экспорт и проверки готовых файлов
  #     (ссылки, ответов нет в сборке, картинки);
  #   • «Проверки в браузере (1–4)» — каждое собирает сайт само и
  #     гоняет свою часть сценариев в Chromium и WebKit над Apache;
  #   • «Итог — все проверки» — зелёный, только когда прошли все.
  # Новую проверку ставьте в задание того же рода, где сейчас меньше
  # всего работы (время шагов видно в журнале запуска).

  bez-sborki-1:
    name: Проверки без сборки (1)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      # Чужие задачники, тренажёры и конспекты в репозиторий не кладутся:
      # PDF — только в app/public/materials/ и docs/ (не в docs/sources/),
      # и нигде нет имён известных сторонних источников. Исключения —
      # списком в самом скрипте.
      - name: Проверить, что в репозитории нет чужих материалов
        working-directory: app
        run: pnpm test:repo-files

      # Репозиторий публичный: ключи, пароли и адрес сервера живут только
      # в GitHub Secrets и на сервере (docs/SERVER.md). Сначала проверка
      # ловит подсаженные секреты, потом смотрит весь репозиторий.
      - name: Проверить, что в репозитории нет ключей и паролей сервера
        working-directory: app
        run: pnpm test:infra-secrets

      # Банк задания №3: 190 вариантов, у каждого ответ считается
      # дважды — по формуле прототипа и по трёхмерной модели.
      - name: Проверить банк задания №3
        working-directory: app
        run: pnpm test:zadanie3

      # Часть 2: баллы 1–20, шкала 0…33, автопроверка ответов по типам полей.
      - name: Проверить баллы, шкалу и автопроверку части 2
        working-directory: app
        run: pnpm test:chast2

      # Разборы типов №3 и №15 («О задании»): у каждого типа один разбор;
      # ответ №3 равен ответу банка на тех же числах, ответ №15 — расчёту
      # по координатам модели; задачи ФИПИ есть в снимке банка; формулы
      # набираются KaTeX; шаги чертежа не обгоняют текст. Без браузера.
      - name: Проверить разборы стереометрии
        working-directory: app
        run: pnpm test:stereo-razbory

      # №3, новая методика (глава 2 и блок 2 опорных): ответы двумя
      # способами — формулой и по координатам чертежа; лайфхаки на
      # случайных ступеньках; ответы запечатаны; рисунки движка без
      # наложений подписей; формулы набираются KaTeX. Без браузера.
      - name: Проверить методику №3
        working-directory: app
        run: pnpm test:stereo-metodika

      # Опорные задачи №5: ответ каждой задачи заново посчитан точными
      # дробями из условия; в каждом блоке по десять задач, блоки по
      # порядку методов; один и тот же ответ в данных, в решении и в
      # автопроверке карточки.
      - name: Проверить опорные задачи задания №5
        working-directory: app
        run: pnpm test:opornye-5

      # Справочник по планиметрии (№1): карточки, «Где на ЕГЭ» покрывает
      # прототипы 1–75, ответы разборов сходятся с задачами банка,
      # обязательные пункты на месте, KaTeX строго; файл вычитки
      # docs/spravochnik-1/soderzhanie.md совпадает с данными.
      - name: Справочник по планиметрии задания №1
        working-directory: app
        run: pnpm test:spravochnik-1

      # Упоминания по всему сайту: если в условии «таблица», «на рисунке»,
      # «по графику», «на диаграмме» — у задачи есть таблица или рисунок.
      - name: Упоминания таблиц и рисунков в условиях
        working-directory: app
        run: pnpm test:upominaniya

      # Задание №10 «Прикладные задачи»: пересчёт ответов ФИПИ и аналогов,
      # отпечатки, распределение ответов, диапазоны величин, KaTeX и
      # «чистота» формул (нет «1x», «+ −», «−(−»).
      - name: Автотест задания №10
        working-directory: app
        run: pnpm test:prikladnye

      # Задание №7 «Простейшие уравнения»: пересчёт корней подстановкой и
      # независимым численным поиском, ОДЗ и посторонние корни,
      # распределение ответов аналогов, KaTeX и «чистота» формул.
      - name: Автотест задания №7
        working-directory: app
        run: pnpm test:uravneniya

      # Новый №12 ЕГЭ-2027 «Наибольшее и наименьшее значение функции»
      # (номер хранения 21): ответ каждой задачи пересчитан перебором по
      # самой функции, формула на экране вычислена прямо из TeX, каталог
      # тренажёра, примеры и опорные задачи (scripts/check-naibolshee.mjs).
      - name: Самотест задания «Наибольшее и наименьшее значение»
        working-directory: app
        run: pnpm test:naibolshee

      # Каркас №16: разбор ответа-промежутков, знаки метода интервалов
      # по кратности, чертежи сходятся с ответами, данные глав
      # (в работе не больше десяти заданий, ответы разбираются).
      - name: Проверить каркас задания №16
        working-directory: app
        run: pnpm test:zadanie16

      # Относительные импорты: проверка типов на CSS не смотрит,
      # и неверный путь к стилям находился только на сборке.
      - name: Проверить относительные импорты
        working-directory: app
        run: pnpm test:imports

      # Генератор гиперболы задания №12: все наборы подтемы на серии
      # seed; точки на графиках, A и B — точки пересечения, B за рамкой,
      # ответ не читается с чертежа и сходится с разбором.
      - name: Проверить генератор гиперболы задания №12
        working-directory: app
        run: pnpm test:graph-rational --seeds 40

      # Показательная функция: все наборы на 500 seed — на каждый прототип
      # 500 наборов по 20 аналогов. Ответ не читается с рисунка, хвост не
      # касается асимптоты, разбор и подсказка собираются, ответ сходится.
      - name: Проверить генератор показательной функции
        working-directory: app
        run: pnpm test:graph-exponential --seeds 500

      # Логарифмическая функция: то же на 500 seed — ответ не читается с
      # рисунка, кривая не касается асимптоты, точки и ответ в области
      # определения, разбор и подсказка собираются, ответ сходится.
      - name: Проверить генератор логарифмической функции
        working-directory: app
        run: pnpm test:graph-logarithmic --seeds 500

      # Комплекты печатных листов всех генераторов: 200 комплектов на
      # генератор. На листе ученика нет пунктиров, заливок, дуг,
      # подписей с «?» и точек, которых нет в условии; у ученика и
      # учителя одного комплекта те же условия и те же рисунки условия;
      # комплект из localStorage собирает те же задания и ответы.
      - name: Проверить комплекты листов генераторов
        working-directory: app
        run: pnpm test:komplekty

      # Онлайн-вариант через кабинет (этап 2), пробная реализация кабинета:
      # выдача серии, ключ закрыт от ученика, тренировка с подсказками и
      # второй попыткой, контрольная, таблица класса и выгрузка в Excel.
      # Те же правила в базе — в test:soglasiya-sql (supabase/tests/variant.test.sql).
      - name: Проверить онлайн-вариант через кабинет
        working-directory: app
        run: pnpm test:variant-kabinet

      # Подсказки тренажёра «Гипербола»: шаги те же, что в полном
      # решении; в каждом вопросе с кнопками один верный вариант, и он
      # сходится с ключом по чертежу.
      - name: Проверить подсказки тренажёра гиперболы
        working-directory: app
        run: pnpm test:rational-hints

      # Сохранение тренировок: запись и чтение, сброс битых и устаревших
      # записей, раздел по адресу, работа без localStorage.
      - name: Проверить хранилище сессии тренажёров
        working-directory: app
        run: pnpm test:trainer-session

      # Таблица согласий и кабинет на настоящем PostgreSQL (он есть на
      # раннере), каждый набор в своей базе. Согласия: без галочек
      # пользователь не создаётся, подтверждение родителя, выгрузка,
      # удаление. Кабинет: регистрация по приглашению или по списку
      # адресов, один администратор (назначается на сервере), ДЗ и попытки.
      # Правила доступа (RLS) единой схемы на фоне прав своего сервера:
      # аноним, чужой ученик, чужой класс, репетитор без класса.
      # Онлайн-вариант: ключ закрыт от ученика, проверка функциями базы,
      # нормализация ответа — по таблице случаев, общей с сайтом.
      - name: Согласия и кабинет в базе
        working-directory: app
        run: pnpm test:soglasiya-sql

      # Ответ ученика: запись бланка, подсказки о формате, точное
      # сравнение, дробь с верным значением в тренажёре (lib/otvet).
      - name: Модуль ответов
        working-directory: app
        run: pnpm test:otvet

      # Журнал попыток, «Мои ошибки» с аналогами, закладки, история и
      # слияние двух устройств (lib/progressLog, lib/accountSync/merge).
      - name: Журнал попыток и слияние устройств
        working-directory: app
        run: pnpm test:progress-log

      # «Карта ЕГЭ»: состояния областей, рекомендация, прогноз, пролив и
      # каталог на трёх тестовых учениках (lib/karta).
      - name: Карта ЕГЭ — расчёт
        working-directory: app
        run: pnpm test:karta

      # Разделы, переведённые со счётчиков на журнал попыток: прежние данные
      # сворачиваются без потерь, прежние ключи целы, исход «с подсказкой».
      - name: Перевод разделов на журнал попыток
        working-directory: app
        run: pnpm test:progress-perevod

  bez-sborki-2:
    name: Проверки без сборки (2)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      - name: Тренажёр №3 — карта типов, сборка тренировок, данные прототипов
        working-directory: app
        run: pnpm test:zadanie3-trening

      # №7 в «Стеклянной сцене»: прежний прогресс (ключ budetege:zadanie-7:v1)
      # сворачивается в общий журнал без потерь и остаётся на месте, прежняя
      # запись тренировки открывается, тренировки собираются. Без браузера.
      - name: Тренажёр №7 — перенос прежнего прогресса, сборка тренировок
        working-directory: app
        run: pnpm test:progress-7

      # №6 на том же общем тренажёре: прежний прогресс (budetege:zadanie-6:v1),
      # прежняя запись тренировки (режим «Проверка» → «Без подсказок»),
      # источники и формулировка. Без браузера.
      - name: Тренажёр №6 — перенос прежнего прогресса, сборка тренировок
        working-directory: app
        run: pnpm test:progress-6

      # №4 в «Стеклянной сцене»: прежний прогресс (budetege:veroyatnost-4:v2 и журнал
      # после PR #340), «Узнай метод», опорные, прежняя запись тренировки, запись
      # ответа по общему правилу. Без браузера.
      - name: Тренажёр №4 — перенос прежнего прогресса, сборка тренировок
        working-directory: app
        run: pnpm test:progress-4

      # №5 на том же тренажёре: прежний прогресс (budetege:veroyatnost-5:v2 и журнал
      # после PR #340), «Узнай метод», опорные, прежняя запись тренировки. Без браузера.
      - name: Тренажёр №5 — перенос прежнего прогресса, сборка тренировок
        working-directory: app
        run: pnpm test:progress-5

      # №11 на том же общем тренажёре: прежний прогресс (budetege:zadanie-11:v1
      # и журнал после PR #340), задачи прежнего генератора, прежние записи
      # тренировки (панель фильтров), файлы задач public/data/zadanie11 свежие
      # и без ответов, «Где теряют балл» у всех 68 типов. Без браузера.
      - name: Тренажёр №11 — перенос прежнего прогресса, файлы задач, тренировки
        working-directory: app
        run: |
          pnpm test:progress-11
          pnpm test:bank-11

      - name: Тексты №11 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-11-teksty
      # №1 на том же общем тренажёре: прежний прогресс (budetege:planimetriya-1:v1
      # и журнал после #340), прежняя запись тренировки панели фильтров, каждая
      # из 1714 задач собирается движком с тем же ответом. Без браузера.
      - name: Тренажёр №1 — перенос прежнего прогресса, сборка тренировок
        working-directory: app
        run: pnpm test:progress-1

      # №13 на том же общем тренажёре: прежний прогресс (budetege:zadanie-13:v1 и
      # журнал после PR #340), прежняя запись тренажёра с фильтрами, каталог
      # (660 задач собираются движком, ответ и «единицы» сходятся). Без браузера.
      - name: Тренажёр №13 — перенос прежнего прогресса, сборка тренировок
        working-directory: app
        run: pnpm test:progress-13

      # №2 на том же общем тренажёре: прежний прогресс (budetege:vektory-2:v1),
      # каталог из проверенных seed генератора, прежняя запись тренировки.
      - name: Тренажёр №2 — перенос прежнего прогресса, каталог, тренировки
        working-directory: app
        run: pnpm test:progress-2

      # №9 на том же общем тренажёре: задачи строит генератор по ключам банка
      # зафиксированных вариантов; прежний прогресс (budetege:proizvodnaya-9:v1)
      # и прежняя незаконченная тренировка («Контроль» → «Без подсказок»). Без браузера.
      - name: Тренажёр №9 — перенос прежнего прогресса, каталог, тренировки
        working-directory: app
        run: pnpm test:progress-9

      - name: Тексты №3 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-3-teksty

      - name: Тексты №6 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-6-teksty

      - name: Тексты №4 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-4-teksty

      - name: Тексты №5 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-5-teksty

      - name: Тексты №1 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-1-teksty

      - name: Тексты №13 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-13-teksty

      - name: Тексты №2 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-2-teksty

      - name: Тексты №9 для вычитки совпадают с исходниками
        working-directory: app
        run: pnpm test:zadanie-9-teksty

      # Выделенные фигуры №3 (сечения, треугольники, диагонали): видимость
      # каждой стороны — лучом, как у рёбер, при трёх ракурсах; одна линия
      # не рисуется дважды (двойной пунктир сливается в сплошную).
      - name: Проверить видимость выделенных фигур стереометрии
        working-directory: app
        run: pnpm test:stereo-vydelenie

      # Часть 2 вариантов повышенной сложности: каждый ответ 14–20 сверяется
      # вторым способом (перебор, координаты, сетка), утверждение а) у 15 и
      # 18 — численно, версии различаются, баллы и плашки, ссылки на теоремы.
      - name: Проверить часть 2 вариантов повышенной сложности
        working-directory: app
        run: pnpm test:povyshennye-chast2

      # Ежемесячные варианты: все ответы частей 1 и 2 пересчитаны вторым
      # способом, №19 и №20 — перебором, №6 не повторяет повышенные.
      - name: Проверить ежемесячные варианты
        working-directory: app
        run: pnpm test:ezhemesyachnye

      # Тренажёр с фильтрами сверху (№12): числа на чипах равны числу
      # задач, фильтр возвращается из ссылки 1:1, «Расширить» и «Мои
      # задачи» берут то, что обещают, старые тренировки собираются теми
      # же задачами. Без браузера.
      - name: Проверить фильтры тренажёра
        working-directory: app
        run: pnpm test:trenazher-filtry

      # Банки заданий №4 и №5 и прототипы конспекта: 53 прототипа,
      # 816 вариантов, у каждого ответ считается дважды — по формуле
      # прототипа и перебором исходов. Плюс 58 подготовительных задач,
      # соглашение о формулах шагов и лабиринт задачи 33:
      # его стены сверяются с генератором картинки tools/gen_maze.py.
      # Тут же формулы всех разборов набираются KaTeX в строгом
      # режиме: формула, которую KaTeX не принял, роняет проверку.
      - name: Проверить банк заданий №4 и №5
        working-directory: app
        run: pnpm test:veroyatnost

      # Задание №2: движок рисунков (остриё ровно в узле сетки, подписи
      # ничего не касаются, катеты только по явному hints), генераторы
      # 19 прототипов на 1000 seed (ответ целый или конечная десятичная
      # дробь, независимый пересчёт сходится, рисунок по ограничениям,
      # формулы собираются KaTeX строго) и банк из 10 вариантов.
      - name: Проверить движок, генераторы и банк задания №2
        working-directory: app
        run: pnpm test:vektory

      # Задание №13 «Экономические задачи»: независимый солвер таблицы
      # по периодам воспроизводит ответы задач из материалов автора,
      # ЕГЭ и демоверсий ФИПИ; проверка «число верное, единицы нет»;
      # сокращённые таблицы. С прототипами — генерация банка.
      - name: Автотест задания №13
        working-directory: app
        run: pnpm test:zadanie13

      # Общая теория «Единицы измерения» и «Степени десяти» (№10 и №11):
      # KaTeX, каждая цепочка «a = b = c» пересчитана с учётом единиц —
      # в теории, в примере из банка и во всех решениях банков №10/№11
      # (шаг перевода по методу, без готового «·3,6»); слоты stepeni-*.
      - name: Единицы и степени десяти — теория и решения
        working-directory: app
        run: pnpm test:edinicy

      # Задание №6 «Случайные величины»: пересчёт ответов решателем и
      # независимо, суммы вероятностей, распределение ответов, уникальность,
      # доля сюжетных (20 из 50), разметка, раскладка диаграмм и деревьев.
      - name: Автотест задания №6
        working-directory: app
        run: pnpm test:sluchainye-velichiny

      # №10, уроки репетитора: код комплекта восстанавливает все 9 уроков
      # побайтно в «чистом» процессе, повторов нет, итоговая — только ФИПИ,
      # перегенерация меняет только свой урок; генератор — один запрос,
      # одни задачи у ученика и учителя.
      - name: Комплекты уроков задания №10
        working-directory: app
        run: pnpm test:seriya-10

      # Порядок обхода задач внутри навыка: «дальше» ведёт
      # к ближайшей нерешённой, а не к следующему номеру.
      - name: Проверить порядок подготовительных задач
        working-directory: app
        run: pnpm test:prep-order

      # Кольцо прогресса подтемы: что считается пунктом и когда он
      # пройден. Новый пользователь — 0%, условие пункта — ровно 1/N,
      # подтемы не смешиваются.
      - name: Проверить расчёт прогресса подтемы
        working-directory: app
        run: pnpm test:topic-progress

      # Тригонометрические функции: то же на 500 seed — точки в узлах со
      # значениями −1, 0, 1, волна в окне, ветви тангенса не касаются
      # асимптот, ответ не совпадает с координатами точек, разбор и
      # подсказка собираются.
      - name: Проверить генератор тригонометрических функций
        working-directory: app
        run: pnpm test:graph-trigonometric --seeds 500

      # Онлайн-вариант: нормализация ответа ЕГЭ (таблица случаев), баллы
      # и шкала, детерминизм серии (тот же код → те же варианты), нет
      # повторов в серии из 10 вариантов, код результата без потерь,
      # статистика, аналоги для «Работы над ошибками».
      - name: Проверить онлайн-вариант
        working-directory: app
        run: pnpm test:variant-online

      # Общий генератор (components/generator): каждый пресет даёт годный
      # набор, один seed — один лист у ученика и учителя, на листе
      # ученика нет ответов и пометок, ссылка на набор открывает тот же
      # лист, старые адреса листов открываются.
      - name: Проверить общий генератор
        working-directory: app
        run: pnpm test:generator

      # Серия уроков №9: код комплекта восстанавливает всю серию на любом
      # устройстве — уроки на «чистом» процессе и в обратном порядке
      # совпадают побайтно, уроки не повторяют задачи, пока банк не исчерпан.
      - name: Проверить серию уроков №9
        working-directory: app
        run: pnpm test:seriya-9

      # Подпись графика стоит у своего графика: на чертежах всех наборов
      # №12 с двумя и более подписанными графиками (10 seed) подписи не
      # стоят столбиком и не ближе к чужому графику.
      - name: Проверить подписи графиков движка
        working-directory: app
        run: pnpm test:curve-labels --seeds 10

      # Названия разделов №12 едины: заголовок — функция, подпись — график
      # (таблица в самом скрипте). Список разделов один, data/functionTypes.ts;
      # в исходниках нет названий, вписанных руками мимо него.
      - name: Проверить названия разделов №12 (исходники)
        working-directory: app
        run: pnpm test:razdely-names --src

      # Перенос прогресса гостя в аккаунт: ключи из списка переноса
      # действительно пишут разделы, правило ключа — одно на сайте и в базе.
      - name: Список переноса прогресса в аккаунт
        working-directory: app
        run: pnpm test:progress-import

      # Каталог прототипов кабинета (src/content/kabinet/katalog.json и
      # supabase/seed/kabinet_katalog.sql) совпадает с банком в коде.
      - name: Каталог банка для кабинета
        working-directory: app
        run: pnpm test:kabinet-catalog

      # Структура экзамена (src/content/struktura.js): какой раздел на каком
      # номере ЕГЭ, в какой части и сколько баллов даёт. Разделы и номера
      # хранения не повторяются; в структуре из 20 заданий номер ЕГЭ равен
      # номеру хранения (сайт показывает то же, что раньше); структура из
      # 19 заданий — по демоверсии ЕГЭ-2027: номера, части, 32 балла.
      # Вторым запуском — список заданий сайта по структуре из 19 заданий.
      - name: Структура экзамена и слой соответствия
        working-directory: app
        run: |
          pnpm test:struktura
          STRUKTURA_EGE=2027-19 pnpm test:struktura

      # Варианты по обеим структурам: из каких заданий собирается вариант,
      # номер задачи на экране и на листе, баллы частей (13 + 20 = 33 и
      # 12 + 20 = 32), шкала из структуры; код варианта, собранный по
      # прежней структуре, читается как раньше.
      - name: Варианты и структура экзамена
        working-directory: app
        run: |
          pnpm test:variant-struktura
          STRUKTURA_EGE=2027-19 pnpm test:variant-struktura

      # Номер задания ЕГЭ в текстах сайта руками не пишется: он берётся из
      # struktura.js, чтобы смена структуры экзамена была правкой одного
      # файла. Комментарии и имена файлов не смотрит: там номер хранения.
      - name: Номера заданий ЕГЭ в текстах — только из структуры
        working-directory: app
        run: pnpm test:nomera

  bez-sborki-3:
    name: Проверки без сборки (3)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      # Движок живых чертежей стереометрии: статика не тронута (вид по
      # умолчанию = orthoAt(28°, 25°)), шаги решения выделяют свои
      # элементы, рамка не прыгает при вращении, подписи не налезают
      # при 48 ракурсах каждого чертежа банка, скорость кадра; призма,
      # пирамида и тетраэдр точного ядра №15. Без браузера.
      - name: Проверить движок живых чертежей стереометрии
        working-directory: app
        run: pnpm test:stereo-engine

      - name: Чертежи №3 в экранной теме (буквы вершин, величины, видимость)
        working-directory: app
        run: pnpm test:stereo-ekran

      # Чертежи стереометрии при вращении руками: банк №3, опорные,
      # разборы №3 и №15 в пяти ракурсах — подписи не налезают и не
      # лежат на линиях, буквы условия есть на чертеже, подписи
      # закрытых вершин бледнее, пунктир пересчитывается. Без браузера.
      - name: Проверить чертежи стереометрии при вращении
        working-directory: app
        run: pnpm test:stereo-vrashchenie

      # Качество чертежей №3 (91 шаблон, банк и 50 случайных наборов
      # параметров на шаблон): видимость каждого куска линии против
      # независимого луча, вид по метрикам (вершины не слипаются, отрезки
      # не сливаются, пропорции 0,8–1,4), подписи не на линиях, толщины
      # и штрих в pt, кегль ≥ 10 pt. Без браузера.
      - name: Проверить качество чертежей стереометрии
        working-directory: app
        run: pnpm test:stereo-kachestvo

      # Генераторы задания №8: 26 прототипов, на каждом уровне по
      # 1000 seed — ответ всегда целый или конечная десятичная дробь,
      # сходится с независимым численным счётом, формулы набираются
      # KaTeX. Плюс банк: по десять разных вариантов на прототип.
      - name: Проверить генераторы и банк задания №8
        working-directory: app
        run: pnpm test:vychisleniya

      # Задание №9: движок рисунков графиков и прототипы групп I–V
      # (рисунок ученика чист, ответ сходится с независимым пересчётом,
      # формулы собираются KaTeX строго), банк и листы генератора.
      - name: Проверить движок, генераторы и банк задания №9
        working-directory: app
        run: pnpm test:proizvodnaya

      # Задание №1: движок чертежей (образцы, 1000 случайных генераций,
      # живые чертежи), банк и аналоги, теория (формулы численно),
      # опорные задачи, тренажёр, генератор и листы уроков; файлов
      # сторонних источников в git нет.
      - name: Проверить задание №1
        working-directory: app
        run: pnpm test:planimetria

      # Задание №1, «Для репетиторов»: код комплекта восстанавливает всю
      # серию из 16 уроков байт в байт (две чистые сборки), без
      # повторов задач, итоговая — только открытый банк.
      - name: Серия уроков задания №1 по коду
        working-directory: app
        run: pnpm test:seriya-1

      # Задание №11: каждая задача открытого банка и разминки решается
      # функцией своего подтипа — ответ сходится с банком, разбор идёт
      # этапами и кончается ответом, формулы собираются KaTeX строго,
      # вне $…$ нет формул обычным текстом; таблицы S|v|t, A|p|t и
      # концентрации; генератор — 200 новых задач на подтип с теми же
      # проверками и сверкой задуманного ответа; склонения.
      - name: Проверить банк, разборы и генератор задания №11
        working-directory: app
        run: pnpm test:zadanie11

      # «Проверь себя» в теории единиц: генератор — по 500 экземпляров на
      # шаблон (один верный, все варианты разные, ответ «красивый»,
      # запятая и разряды, подсказка к каждой ошибке), отпечатки ответов.
      - name: «Проверь себя» в теории единиц — генератор
        working-directory: app
        run: pnpm test:proverka-edinic

      # Ядро сечений №15: точная арифметика (дроби и корни), сечения
      # куба и параллелепипеда, правила метода следов и цепочки
      # происхождения точек.
      - name: Проверить ядро сечений задания №15
        working-directory: app
        run: pnpm test:zadanie15

      # Чертежи №3: видимость рёбер при разных ракурсах (общее ядро
      # lib/stereo), валидатор сценариев, все 510 вариантов
      # многогранников, подписи без наложений, одинаковые наборы
      # листов ученика и учителя.
      - name: Проверить чертежи задания №3
        working-directory: app
        run: pnpm test:chertezh3

      # Задание №14: каждая задача проверяется численно (серии — корни,
      # других корней нет), формулы — KaTeX, подписи окружностей не
      # пересекаются, у каждой рамки теории есть пример.
      - name: Проверить задание №14
        working-directory: app
        run: pnpm test:zadanie14

      # Относительные импорты: проверка типов на CSS не смотрит,
      # и неверный путь к стилям находился только на сборке.
      - name: Проверить 3D-котика (модель собирается так же)
        working-directory: app
        run: pnpm test:kotik

      # Генератор параболы задания №12: девять наборов подтемы
      # собираются на своём seed и на серии случайных, каждый ответ —
      # целое или конечная десятичная дробь, чертёж читается на сетке.
      - name: Проверить генератор параболы задания №12
        working-directory: app
        run: pnpm test:graph-quadratic

      # Генератор графика корня задания №12: все наборы подтемы на
      # серии seed; целые точки на графике, A и B — точки пересечения,
      # ответ не читается с чертежа и сходится с разбором; в подсказке
      # у каждого вопроса один верный вариант, последний — ключ.
      - name: Проверить генератор графика корня задания №12
        working-directory: app
        run: pnpm test:graph-sqrt --seeds 40

      # Подписи точек на всех чертежах №12 (условие, подсказка, решение,
      # лист учителя) и на рисунках теории: ни одна не лежит на кривой, осях,
      # штрихах построения, чужой подписи и не выходит за рамку.
      - name: Проверить подписи точек на чертежах
        working-directory: app
        run: pnpm test:point-labels --seeds 12

      # Запись решений №12 (лист учителя и разборы тренажёра): нет
      # f((−5)), «+ (−3)», умножения на 1 и −1; k прямой — через
      # треугольник; дроби в решениях на листе — крупные (\dfrac).
      - name: Проверить запись решений задания №12
        working-directory: app
        run: pnpm test:solution-tex

      # Угловой коэффициент k (и f'(x₀) в №9) — только через треугольник:
      # нет (y₂ − y₁)/(x₂ − x₁), Δy/Δx и системы для k ни в исходниках,
      # ни в собранных разборах и подсказках; треугольник на чертеже
      # разбора и в подсказке тренажёра.
      - name: Проверить, что k находится только по треугольнику
        working-directory: app
        run: pnpm test:k-treugolnik

      # Подсказки тренажёра «Парабола»: шаги те же, что в полном
      # решении; ветки «вершина в узле» и «c видно» верны; подсказка
      # доходит до ключа; предупреждения о тождестве на месте;
      # вспомогательной системы координат на чертеже задачи нет.
      - name: Проверить подсказки тренажёра параболы
        working-directory: app
        run: pnpm test:quadratic-hints

      # Подход тренажёра №3: в смешанном режиме подряд не больше
      # двух заданий одного типа, повторов в подходе нет.
      - name: Проверить подход тренажёра задания №3
        working-directory: app
        run: pnpm test:z3-round

      # «Весь №12» без браузера: варианты зачётной по коду работы одни и
      # те же в двух процессах Node, состав прототипов у вариантов один,
      # задачи не повторяются, «Только ФИПИ» — только банк; листы ученика
      # и учителя и лист генератора по всем типам собираются.
      - name: Проверить зачётную работу и генератор по всем типам №12
        working-directory: app
        run: pnpm test:zachyot-12

      # Разборы типов задач на «О задании» квадратичной: второй корень по
      # Виету, ордината, ответ в тексте; искомая точка с рисунка не
      # читается, маркера на ней нет, пунктиры не кончаются в узле сетки.
      # Ярлыки «Потренироваться» берут только задачи своего правила ответа.
      - name: Проверить разборы «О задании» и фильтр тренажёра
        working-directory: app
        run: pnpm test:about-examples

      # Формулы в текстах интерфейса и данных задач — только KaTeX ($…$).
      # Падает с файлом и строкой; исключения — списки в самом скрипте.
      - name: Проверить, что математика набрана KaTeX (исходники)
        working-directory: app
        run: pnpm test:math-markup --src

      # Политика, согласие и соглашение — слово в слово из утверждённого
      # файла; правила регистрации (галочки, родитель, повтор письма).
      - name: Правовые документы и правила согласий
        working-directory: app
        run: pnpm test:legal

      # Регистрация только с почтой российских почтовых сервисов: список
      # доменов в форме и в базе один, сравнение без регистра и пробелов,
      # поддомены не проходят; входа через Google, VK и т. п. нет.
      # Сама база — в test:soglasiya-sql (supabase/tests/domeny.test.sql).
      - name: Почтовые домены регистрации
        working-directory: app
        run: pnpm test:domeny

      # Печать ДЗ: лист ученика и лист учителя — из одних и тех же задач ДЗ,
      # на листе ученика нет ответов и меток «банк/новая», клетка — только у него.
      - name: Печать ДЗ — один набор задач на листе ученика и учителя
        working-directory: app
        run: pnpm test:dz-print

  build:
    name: Сборка
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      # next.config.ts собран с output: 'export' — результат в app/out.
      # Здесь же отрабатывает ESLint: именно этот шаг ловит ошибки кода.
      - name: Собрать статический экспорт
        working-directory: app
        run: pnpm build

      - name: Проверить, что экспорт не пустой
        run: test -f app/out/index.html

      # Галерея банка №1 показывает ответы: только в разработке. В сборке
      # сайта её маршрута нет (404) и нет её следов в бандле.
      - name: Галереи банка задания №1 нет в сборке
        working-directory: app
        run: pnpm test:galereya-1

      # №10: слоты иллюстраций сюжетов (список пустых — в журнале), на
      # страницах раздела нет заглушек, все изображения отдаются с 200.
      - name: Иллюстрации задания №10
        working-directory: app
        run: |
          pnpm test:illyustracii-10
          pnpm test:illyustracii-10 --site

      # Все внутренние ссылки — с «/» на конце (/zadaniya/, а не /zadaniya):
      # адрес без косой черты хостинг уводит редиректом на http, и Safari
      # на iPhone вместо страницы показывал белый экран. Смотрятся все
      # HTML и данные роутера (index.txt); пропускаются файлы с
      # расширением, якоря, mailto: и tel:. Хоть одна такая ссылка —
      # проверка падает.
      - name: Проверить, что ссылки кончаются на «/»
        working-directory: app
        run: pnpm test:trailing-slash

      # Внутренние ссылки не ведут на страницы-заглушки старых адресов
      # («Страница переехала») и в 404; у каждой заглушки есть 301 в
      # public/.htaccess (scripts/check-links.mjs).
      - name: Проверить ссылки (заглушки и 404)
        working-directory: app
        run: pnpm test:links

      # То же на собранных страницах: формулы, склеенные из кусков.
      - name: Проверить, что математика набрана KaTeX (сайт)
        working-directory: app
        run: pnpm test:math-markup --site

      # То же на собранном сайте: прежних названий («Прямая и её наклон»,
      # «Иррациональная функция (график корня)» и др.) нет, карточки,
      # данные страниц, крошки, шапка, title, description и Open Graph —
      # по таблице и в её порядке.
      - name: Проверить названия разделов №12 (сайт)
        working-directory: app
        run: pnpm test:razdely-names --site

      # Ответы и разборы не уезжают в бандл открытым текстом.
      # Проверка идёт после сборки: смотреть надо на то, что
      # получилось, а не на исходники.
      - name: Проверить, что ответов нет в сборке
        working-directory: app
        run: pnpm test:secrets

      # PDF и картинки из public/ лежат под постоянными именами, а хостинг
      # кеширует их на год. Ссылка на такой файл несёт версию ?v=<хеш
      # содержимого> (lib/assetUrl.ts): перезалили файл — ссылка новая.
      # Проверка падает на ссылке без версии или с устаревшей.
      - name: Проверить версии в ссылках на PDF и картинки
        working-directory: app
        run: pnpm test:asset-versions

      # Задачи №4 и №5 собраны по сборнику и урокам автора, но названия
      # источников и номера задач в них — служебные и на экран не идут.
      # Проверка ищет их на собранных страницах №4 и №5.
      - name: Проверить, что источники задач №4 и №5 не видны
        working-directory: app
        run: pnpm test:istochniki

      # Картинка не должна пропадать с сайта молча: в сборке нет заглушек
      # «Иллюстрация готовится», а каждый адрес картинки из страниц, данных
      # роутера и кода отдаёт 200 с типом image/*. Удалили файл — тест
      # падает, пока не поставлена замена.
      - name: Проверить, что в сборке нет заглушек и битых картинок
        working-directory: app
        run: pnpm test:illustrations

      # Картинки №12: у каждого раздела из data/functionTypes.ts есть
      # стеклянная иконка всех ширин с прозрачным фоном; на странице №12 и
      # страницах разделов есть иконки всех разделов и главная
      # иллюстрация, каждый адрес отдаёт 200 с типом image/*, заглушек нет.
      - name: Проверить картинки разделов №12
        working-directory: app
        run: |
          pnpm test:razdely-12-images
          pnpm test:razdely-12-images --site

  brauzer-1:
    name: Проверки в браузере (1)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      # Каждое задание с проверками в браузере собирает сайт само: так
      # быстрее, чем гонять между машинами app/out (больше гигабайта).
      - name: Собрать статический экспорт
        working-directory: app
        run: pnpm build

      # Apache, Chromium, WebKit, poppler (.github/actions/brauzery).
      - name: Поставить Apache, Chromium и WebKit для проверок в браузере
        uses: ./.github/actions/brauzery

      # Лента вкладок раздела прилипает к верху окна и не повисает посреди
      # страницы: все вкладки №11 (и теория №2 для сравнения), Chromium и
      # WebKit, ширина компьютера и телефона; подпункт содержания встаёт
      # под лентой.
      - name: Проверить липкую ленту вкладок
        working-directory: app
        run: pnpm test:sticky-tabs

  brauzer-2:
    name: Проверки в браузере (2)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      # Каждое задание с проверками в браузере собирает сайт само: так
      # быстрее, чем гонять между машинами app/out (больше гигабайта).
      - name: Собрать статический экспорт
        working-directory: app
        run: pnpm build

      # Apache, Chromium, WebKit, poppler (.github/actions/brauzery).
      - name: Поставить Apache, Chromium и WebKit для проверок в браузере
        uses: ./.github/actions/brauzery

      # Служебные страницы (page.dev.tsx: галереи банков с ответами и
      # /dev/intro — прототип заставки первого визита) есть только в
      # разработке. В экспорте их нет: ни папки, ни кода, адрес отдаёт
      # 404 — и у статического сервера, и у Apache (поэтому шаг — после
      # его установки).
      - name: Служебные страницы не попали в продакшен
        working-directory: app
        run: pnpm test:dev-pages

      # Справочник по планиметрии №1 для печати: с примерами и без —
      # раскладка в две колонки без обрезанных карточек, каждая карточка
      # один раз, разделы с новой страницы, номера в содержании верны,
      # шапка и «N / M» на каждой странице, формулы без ошибок и не
      # шире рамки; кнопка «Скачать PDF» на странице справочника.
      - name: Проверить PDF справочника №1
        working-directory: app
        run: pnpm test:pdf-spravochnik-1

      # Кнопка «?» стоит на месте: планшеты 768–1024 в обеих ориентациях,
      # телефон и компьютер, Chromium и WebKit. Прокрутка, поворот,
      # переход по вкладкам, клавиатура; кнопка не закрывает управление.
      - name: Проверить кнопку «?» (не скачет, не закрывает управление)
        working-directory: app
        run: pnpm test:fab-stable

      # Окно выбора типа: подсветка и стрелка только при наведении, на 390
      # стрелка видна и подсветка не залипает; блок «Весь раздел»; зачётная
      # от настройки до листов и итогов ученика; лист генератора по всем
      # типам (Chromium уже поставлен).
      - name: Проверить «Весь №12» на сайте
        working-directory: app
        run: pnpm test:ves12-site

      # Эта сборка — без флага NEXT_PUBLIC_AUTH_ENABLED, значит входа на
      # сайте нет: ни кнопки «Войти», ни SDK, ни адреса сервиса, и сайт
      # работает ровно как до появления кабинетов. Сам вход проверяется
      # в auth.yml на отдельных сборках с флагом.
      - name: Проверить, что без флага входа нет
        working-directory: app
        run: pnpm test:auth-disabled

  brauzer-3:
    name: Проверки в браузере (3)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      # Каждое задание с проверками в браузере собирает сайт само: так
      # быстрее, чем гонять между машинами app/out (больше гигабайта).
      - name: Собрать статический экспорт
        working-directory: app
        run: pnpm build

      # Apache, Chromium, WebKit, poppler (.github/actions/brauzery).
      - name: Поставить Apache, Chromium и WebKit для проверок в браузере
        uses: ./.github/actions/brauzery

      # Подписи на чертежах (№1, №3, №18): у корня — знак с чертой над
      # всем подкоренным (путь, а не символ «√» без черты), подписи не
      # обрезаны и не ложатся на линии и засечки, знак корня KaTeX в
      # формуле на чертеже не сплющен правилами контейнера. По 20
      # вариантов каждого шаблона, отрисовка в Chromium и WebKit.
      - name: Проверить подписи на чертежах (корни, дроби, пересечения)
        working-directory: app
        run: pnpm test:drawing-labels --brauzer

      - name: Проверить, что сырой RSC-текст не показывается
        working-directory: app
        run: pnpm test:rsc-serving

      # Переходы без белого экрана: Apache с нашим .htaccess добавляет
      # «/» одним редиректом сразу на https; в WebKit и Chromium на ширине
      # iPhone нижняя кнопка «Банк заданий» открывает банк с тренажёра,
      # раздела, теории и главной — и после 11 минут простоя вкладки;
      # повисший переход открывает страницу целиком.
      - name: Проверить переходы по сайту
        working-directory: app
        run: pnpm test:navigation

      # Сохранение тренировки во всех тренажёрах (№12 — четыре подтемы,
      # №8, №2, №11, №4, №5, «Узнай метод», №3 — все фигуры): верный ответ
      # (его тест считает в Node по рецепту из записи тем же кодом сайта),
      # неверный, перезагрузка, итоги; на представителях — вопрос
      # «продолжить или начать новую», две вкладки, переполнение хранилища,
      # устаревшая запись. Своим сервером над out/, Chromium уже поставлен.
      - name: Проверить сохранение тренировки в тренажёрах
        working-directory: app
        run: pnpm test:trainer-sessions

      # Редизайн разделов первой части: картинки реестра (docs/redesign-kartinki.sha256)
      # не изменены и по-прежнему стоят на страницах, банк и содержание раздела те же,
      # что в main; прежний прогресс №7 виден в новом тренажёре (образец хранилища).
      - name: Редизайн №7 — картинки и содержание не изменены
        working-directory: app
        run: |
          git fetch --depth=1 origin main
          pnpm test:redesign 7 origin/main

      - name: Перенос прогресса №7 в браузере
        working-directory: app
        run: pnpm test:progress-7-site

      - name: Редизайн №6 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 6 origin/main

      - name: Перенос прогресса №6 в браузере
        working-directory: app
        run: pnpm test:progress-6-site

      - name: Редизайн №4 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 4 origin/main

      - name: Перенос прогресса №4 в браузере
        working-directory: app
        run: pnpm test:progress-4-site

      - name: Редизайн №5 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 5 origin/main

      - name: Перенос прогресса №5 в браузере
        working-directory: app
        run: pnpm test:progress-5-site

      - name: Редизайн №11 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 11 origin/main

      - name: Перенос прогресса №11 в браузере
        working-directory: app
        run: pnpm test:progress-11-site
      - name: Редизайн №1 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 1 origin/main

      - name: Перенос прогресса №1 в браузере
        working-directory: app
        run: pnpm test:progress-1-site

      - name: Редизайн №13 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 13 origin/main

      - name: Перенос прогресса №13 в браузере
        working-directory: app
        run: pnpm test:progress-13-site

      - name: Редизайн №2 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 2 origin/main

      - name: Перенос прогресса №2 в браузере
        working-directory: app
        run: pnpm test:progress-2-site

      - name: Редизайн №9 — картинки и содержание не изменены
        working-directory: app
        run: pnpm test:redesign 9 origin/main

      - name: Перенос прогресса №9 в браузере
        working-directory: app
        run: pnpm test:progress-9-site

      # Иллюстрация в верхнем блоке «Задание 12»: разметка (picture, srcset,
      # размеры, высокий приоритет, без lazy), файлы и вес версии на телефон
      # (≤60 КБ), на 390 первая карточка раздела на первом экране, на 1440
      # картинка в правой колонке; анимации нет при reduced-motion и на
      # телефоне; на других заданиях иллюстрации нет (Chromium уже поставлен).
      - name: Проверить иллюстрацию задания №12
        working-directory: app
        run: pnpm test:zadanie-hero

      # Телефон 320 и 375 px: ни одна страница сайта не едет вбок. Широкие
      # формулы и таблицы прокручиваются внутри своего блока — такой блок
      # обрезает содержимое и нарушением не считается. Chromium.
      - name: Нет горизонтальной прокрутки на телефоне (320 и 375 px)
        working-directory: app
        env:
          SHIRINY: "320,375"
        run: pnpm test:mobile-overflow

      # Навигация между разделами №12: плашка над вкладками, меню «Все
      # разделы» (закрытие крестиком, Escape, затемнением, «Назад» и
      # свайпом; фокус; «Скоро» не нажимается), переход на ту же вкладку
      # без перезагрузки и «Назад» обратно; блок «Другие разделы №12».
      # Chromium, 390 и 1440 (Chromium уже поставлен).
      - name: Проверить навигацию по разделам №12
        working-directory: app
        run: pnpm test:razdely-nav

      # Каркас стереометрии (№3 и №15): покрытие банка №3 главами теории
      # и типами «О задании»; одна лента из шести вкладок у обоих
      # заданий, плашка «Задание №… ▾» и меню «Все разделы стереометрии»
      # со ссылками к частям 1 и 2; переход с той же вкладкой; главы и
      # «Содержание»; редиректы прежних адресов фигур №3. Chromium, 390 и 1440.
      - name: Проверить каркас стереометрии
        working-directory: app
        run: pnpm test:stereo-nav

      # Вращение чертежей стереометрии руками: мышь и палец, щипок и
      # колесо, кнопки вида, касание по грани против перетаскивания,
      # прокрутка страницы на телефоне, 60 кадров в секунду. Chromium,
      # 1280 и 390.
      - name: Проверить вращение чертежей стереометрии в браузере
        working-directory: app
        run: pnpm test:stereo-vrashchenie-site

      # Подписи на рисунках примеров 8.2 теории линейной функции («Найти x по
      # значению»): не пересекаются друг с другом, не лежат на графике и не
      # выходят за рисунок; ширина компьютера и телефона (Chromium уже поставлен).
      - name: Проверить подписи на рисунках теории
        working-directory: app
        run: pnpm test:theory-labels

      # Страница темы быстро «оживает» на слабой сети: бюджет размеров HTML и
      # скриптов, тяжёлое (KaTeX, движок задач) не в первой загрузке, нажатие
      # на вкладку до загрузки кода не теряется.
      - name: Проверить первую загрузку страницы темы
        working-directory: app
        run: pnpm test:first-load

      # №8 глазами ученика: поле ответа и подсказки о формате, банк и
      # «решено X из 260», «Мои ошибки» и аналоги, закладки, итоги,
      # «О задании»; без горизонтальной прокрутки на 375–1280.
      - name: №8 — удобства ученика в браузере
        working-directory: app
        run: pnpm test:z8-uchenik

  brauzer-4:
    name: Проверки в браузере (4)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      # Каждое задание с проверками в браузере собирает сайт само: так
      # быстрее, чем гонять между машинами app/out (больше гигабайта).
      - name: Собрать статический экспорт
        working-directory: app
        run: pnpm build

      # Apache, Chromium, WebKit, poppler (.github/actions/brauzery).
      - name: Поставить Apache, Chromium и WebKit для проверок в браузере
        uses: ./.github/actions/brauzery

      # Скрытые разделы в сборке для хостинга: в действующей структуре
      # экзамена их нет — правил 404 в .htaccess нет, страницы разделов
      # собраны как обычно. Сам механизм скрытия проверяет задание
      # «Скрытые разделы» ниже — на пробной сборке по ЕГЭ-2027.
      - name: Скрытые разделы — в сборке для хостинга их нет
        working-directory: app
        run: pnpm test:skrytye

      # Заставка первого визита на собранном сайте (Chromium, Apache):
      # первый визит → заставка → «Пропустить» → окно → тур; второй визит
      # без заставки; reduced-motion и слабое устройство — статичный
      # кадр; «Посмотреть приветствие» из «?»; ссылки с кодом комплекта
      # и на тренажёр — без заставки; нет ошибок в консоли; 390 px без
      # горизонтальной прокрутки; CLS = 0; память после закрытия.
      - name: Проверить заставку первого визита
        working-directory: app
        run: pnpm test:intro

      # Тур по сайту: на каждом шаге на телефоне (390, 375) и компьютере
      # рамка подсветки совпадает с видимой копией цели до 1 px — после
      # перехода к шагу и на каждом кадре прокрутки, при прокрутке ленты
      # вкладок вбок и смене высоты окна; цель не под липкими полосами
      # и не под нижним листом; пропавшая цель — без рамки и без ошибок.
      - name: Проверить тур по сайту
        working-directory: app
        run: pnpm test:tour

      # Тарифы: цены и ступени «До ЕГЭ» — из единого конфига; оплата
      # выключена — на сайте нет ни одной активной кнопки оплаты и
      # разметки Offer (scripts/check-tarify.mjs).
      - name: Тарифы и выключенная оплата
        working-directory: app
        run: pnpm test:tarify

      # Оферта: 14 разделов, цены и сроки из конфига тарифов, docs/oferta.md
      # не отстал от кода; без NEXT_PUBLIC_LEGAL_READY страницы /oferta/,
      # ссылок на неё и реквизитов в подвале нет (scripts/check-oferta.mjs).
      - name: Оферта и реквизиты не опубликованы раньше времени
        working-directory: app
        run: pnpm test:oferta

      # Онлайн-вариант в браузере: контрольная с перезагрузкой (ответы,
      # «вернусь позже», номер задания), подсказка о формате, результат и
      # проверка по коду результата; тренировка на телефоне — своя
      # клавиатура, подсказка и вторая попытка; страница серии и статистика.
      - name: Проверить онлайн-вариант в браузере
        working-directory: app
        run: pnpm test:variant-online-site

      # Лист генератора, напечатанный из браузера, — без пустых страниц.
      # Листы ученика и учителя всех разделов: в Chromium печать в PDF
      # на A4 и на бумаге 841/840 pt без @page (так печатает Safari на
      # iPhone) — страниц столько же, сколько в листе; в WebKit — вёрстка
      # печати: страница с запасом до A4, вне страниц ничего, фон белый.
      - name: Проверить печать листов без пустых страниц
        working-directory: app
        run: pnpm test:print-pages

      # Листы генераторов в PDF (A4, printBackground): страниц столько же,
      # сколько листов в предпросмотре, ни один кусок не заходит на подвал,
      # текст в полях 12 мм, дроби KaTeX целые. №11 «Домашняя работа» с
      # «Повторяем», примером и клеткой, №12, №1, №9, №6 и вариант. Плюс
      # WebKit (Safari на компьютере и iPhone): вёрстка в режиме печати.
      - name: Проверить листы генераторов в PDF
        working-directory: app
        run: pnpm test:pdf-listy

      # То же кольцо в собранном сайте, в Chromium на ширине телефона:
      # открытые вкладки и прокрутка одним рывком прогресса не дают,
      # чтение, «Прочитано», задачи — дают; прогресс переживает
      # перезагрузку и не переходит в другую подтему (Chromium уже поставлен).
      - name: Проверить кольцо прогресса на сайте
        working-directory: app
        run: pnpm test:topic-progress-site

      # Разделы, переведённые на журнал попыток: прежние записи в браузере
      # сворачиваются в журнал, прежние ключи целы, №10 пишет в свой журнал.
      - name: Проверить перевод разделов на журнал попыток
        working-directory: app
        run: pnpm test:progress-perevod-site

      # «Карта ЕГЭ» на сайте: гость и «середина», окошко, панель, пролив,
      # клавиатура; телефон в WebKit — касание, перетаскивание, щипок.
      - name: Проверить карту ЕГЭ на сайте
        working-directory: app
        run: pnpm test:karta-site

      # Ошибка в одном блоке не роняет страницу, сбой загрузки кода лечится
      # одной перезагрузкой: сообщение по-русски вместо белого экрана.
      - name: Проверить границы ошибок
        working-directory: app
        run: pnpm test:error-boundaries

      # Галерея банка №12 (задачи ФИПИ и аналоги с ответами) — только
      # для разработки: в сборке сайта маршрута нет, адрес отдаёт 404.
      - name: Проверить, что галереи банка №12 нет в сборке
        working-directory: app
        run: pnpm test:galereya-12

      # «Проверь себя» в теории единиц №10/№11 в браузере: выбор, проверка,
      # зелёное свечение, подсказка к ошибке, «Попробовать ещё», «Показать
      # разбор», «Ещё такое же», счётчик, клавиатура, aria-live, 44 px,
      # prefers-reduced-motion; 390 и 1440 (Chromium уже поставлен).
      - name: «Проверь себя» в теории единиц — в браузере
        working-directory: app
        run: pnpm test:proverka-edinic-site

      # Чертёж задания №15: three.js грузится только на /zadaniya/15/…,
      # витрина закрыта от поиска; на телефоне 390 px поворот пальцем,
      # щипок и пересчёт штрихов невидимых линий.
      - name: Проверить чертёж задания №15 на сайте
        working-directory: app
        run: pnpm test:zadanie15-vitrina

  # Скрытые разделы (app/src/content/struktura.js, skryt): раздел, которого
  # нет в структуре экзамена, посетителю не виден, а администратору
  # доступен. В действующей структуре из 20 заданий скрытых разделов нет,
  # поэтому сайт собирается ещё раз — по структуре ЕГЭ-2027 из 19 заданий,
  # где скрыт раздел «Случайные величины», и со входом (подмена сервера
  # входа, как в auth.yml): так проверяется и кабинет администратора.
  # Эта сборка никуда не выкладывается.
  skrytye:
    name: Скрытые разделы (пробная сборка по ЕГЭ-2027)
    runs-on: ubuntu-24.04

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v5

      # pnpm, Node.js 22 с кэшем и зависимости (.github/actions/podgotovka).
      - name: Подготовить машину
        uses: ./.github/actions/podgotovka

      - name: Собрать сайт по структуре из 19 заданий, со входом
        working-directory: app
        env:
          STRUKTURA_EGE: '2027-19'
          NEXT_PUBLIC_AUTH_ENABLED: '1'
          NEXT_PUBLIC_AUTH_IN_HEADER: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key # не секрет: ключ мока
        run: pnpm build

      # Apache, Chromium, WebKit, poppler (.github/actions/brauzery).
      - name: Поставить Apache, Chromium и WebKit для проверок в браузере
        uses: ./.github/actions/brauzery

      # 1) правила в .htaccess сборки — по структуре; 2) на страницах
      # раздела noindex, в собранной заранее разметке раздела нет;
      # 3) ни одна публичная страница не ссылается на раздел и не называет
      # его (что ещё не убрано — список POKA в скрипте, с номером PR);
      # 4) настоящий Apache: без метки администратора любой адрес раздела —
      # 404, не редирект, с меткой — 200, везде noindex, соседи не задеты;
      # 5) Chromium (десктоп) и WebKit (iPhone): посетителю «Страница не
      # найдена», администратору раздел с плашкой, поиск по банку раздел
      # не находит; 6) кабинет администратора: «Скрытые разделы» →
      # «Открыть» → раздел с плашкой; у репетитора карточки нет.
      - name: Скрытый раздел не виден посетителю и доступен администратору
        working-directory: app
        env:
          STRUKTURA_EGE: '2027-19'
        run: pnpm test:skrytye --apache --webkit --kabinet --shots skrytye-snimki

      - name: Сохранить снимки скрытого раздела
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skrytye-snimki
          path: app/skrytye-snimki
          if-no-files-found: ignore
          retention-days: 7

  # Одна галочка на всё: зелёная, только если прошли все задания
  # выше. Красная — смотрите, какое из них упало.
  itog:
    name: Итог — все проверки
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - bez-sborki-1
      - bez-sborki-2
      - bez-sborki-3
      - build
      - brauzer-1
      - brauzer-2
      - brauzer-3
      - brauzer-4
      - skrytye

    steps:
      - name: Все задания прошли
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Итоги заданий: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "Не прошло: есть задание с итогом $r"; exit 1; }
          done
