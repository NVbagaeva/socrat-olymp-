name: 'Сервер: миграции'

# Новые миграции из infra/lite/migrations.txt, каталог банка, список
# приглашённых (секрет ALLOWED_EMAILS), почта, добавленная вручную
# (секрет SIGNUP_EXTRA), редакция правовых документов
# (дата из app/src/content/legal/operator.json), администратор (секрет
# ADMIN_EMAIL, необязательно) и пароль роли budetege_admin для туннеля
# к базе (секрет DB_ADMIN_PASSWORD). Уже применённые миграции
# пропускаются; поменять список приглашённых или опубликовать новую
# редакцию документов — тоже эта кнопка.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  migrate:
    name: Миграции и список приглашённых
    runs-on: ubuntu-24.04
    # Ключи сервера — в окружении server (Settings → Environments): оно
    # пускает только ветку main и, если включено, ждёт подтверждения.
    environment: server
    timeout-minutes: 15
    steps:
      # На сервер уезжает код той ветки, с которой нажата кнопка, —
      # поэтому только main.
      - name: Только из main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Эту кнопку можно нажимать только для ветки main (сейчас: $GITHUB_REF_NAME). Сначала влейте изменения в main."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Миграции
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          # Школьная и рабочая почта, добавленная вручную: домены и адреса через
          # запятую. Остальным регистрация — только с почтой российских сервисов.
          SIGNUP_EXTRA: ${{ secrets.SIGNUP_EXTRA }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          # Журнал решения задач: те же Variables, что у сборки сайта.
          ZHURNAL: ${{ vars.NEXT_PUBLIC_ZHURNAL }}
          ZHURNAL_RAZDELY: ${{ vars.NEXT_PUBLIC_ZHURNAL_RAZDELY }}
          # Новая выдача ДЗ: те же Variables, что у сборки сайта.
          DZ_NOVYE: ${{ vars.NEXT_PUBLIC_DZ2 }}
          DZ_NOVYE_RAZDELY: ${{ vars.NEXT_PUBLIC_DZ2_RAZDELY }}
          # Уведомления: флаг сайта и каналы очереди отправки (pochta, push).
          UVEDOMLENIYA: ${{ vars.NEXT_PUBLIC_UVEDOMLENIYA }}
          UVEDOMLENIYA_KANALY: ${{ vars.UVEDOMLENIYA_KANALY }}
        run: infra/lite/actions/migrate.sh

      - name: Письмо о сбое
        if: failure()
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@budetege.ru' }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: infra/lite/actions/notify.sh '«Миграции» не прошли'
