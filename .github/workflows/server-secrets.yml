name: 'Сервер: перенести секреты в окружения'

# Один раз: копирует секреты репозитория в окружения GitHub — ключи
# сервера в server, пароль FTP в site (docs/SERVER.md, «Окружения»). Окружения
# пускают только ветку main, поэтому сценарий из другой ветки секретов
# не получит. После переноса секреты репозитория с теми же именами
# удаляют вручную: Settings → Secrets and variables → Actions.
#
# Значения не печатаются: они идут в gh через stdin. Нужен секрет
# GH_SECRETS_TOKEN с правами Secrets и Environments (чтение и запись)
# на этот репозиторий.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move:
    name: Перенести секреты
    runs-on: ubuntu-24.04
    environment: server
    timeout-minutes: 10
    steps:
      - name: Только из main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Эту кнопку можно нажимать только для ветки main (сейчас: $GITHUB_REF_NAME)."
            exit 1
          fi

      - name: Перенести
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          SERVER_NAMES: ADMIN_EMAIL ALERT_EMAIL ALLOWED_EMAILS BACKUP_AGE_IDENTITY BACKUP_AGE_RECIPIENT DB_ADMIN_PASSWORD GH_SECRETS_TOKEN S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY SEED_STUDENT_EMAILS SEED_TUTOR_EMAIL SERVER_HOST SERVER_KNOWN_HOSTS SERVER_ROOT_PASSWORD SERVER_SSH_KEY SIGNUP_EXTRA SMTP_PASSWORD
          SITE_NAMES: FTP_PASSWORD FTP_SERVER FTP_USERNAME
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SEED_STUDENT_EMAILS: ${{ secrets.SEED_STUDENT_EMAILS }}
          SEED_TUTOR_EMAIL: ${{ secrets.SEED_TUTOR_EMAIL }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_ROOT_PASSWORD: ${{ secrets.SERVER_ROOT_PASSWORD }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SIGNUP_EXTRA: ${{ secrets.SIGNUP_EXTRA }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?нет секрета GH_SECRETS_TOKEN}"
          perenos() {
            local okr=$1 name
            shift
            for name in "$@"; do
              if [ -z "${!name:-}" ]; then
                echo "$name — нет в секретах репозитория (или уже только в окружении), пропуск"
                continue
              fi
              printf '%s' "${!name}" | gh secret set "$name" --env "$okr" --repo "$GITHUB_REPOSITORY"
              echo "$name → окружение $okr"
            done
          }
          # shellcheck disable=SC2086
          perenos server $SERVER_NAMES
          # shellcheck disable=SC2086
          perenos site $SITE_NAMES
          {
            echo '### Секреты перенесены'
            echo
            echo 'Теперь удалите секреты с теми же именами на уровне репозитория:'
            echo 'Settings → Secrets and variables → Actions → Repository secrets.'
            echo 'Окружения server и site: Settings → Environments → Deployment branches → только main.'
          } >> "$GITHUB_STEP_SUMMARY"
