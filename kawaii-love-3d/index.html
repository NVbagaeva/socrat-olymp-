<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Спасибо, что ты рядом · 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; height: 100%; background: #04051a; overflow: hidden; }
  /* Сцена всегда 1080×1920 (вертикальное видео), в браузере масштабируется под окно */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden;
           font-family: 'Nunito', 'Comfortaa', system-ui, sans-serif; background: #04051a; }
  #gl { position: absolute; inset: 0; display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; }

  /* Облачко-реплика (живёт в CSS2DObject, привязанном к голове персонажа) */
  .b-anchor { width: 0; height: 0; }
  .bubble {
    position: absolute; left: 0; bottom: 34px; box-sizing: border-box;
    width: max-content; max-width: 640px; padding: 30px 46px;
    background: #fff; color: #33224d; border-radius: 48px;
    font-weight: 800; font-size: 52px; line-height: 1.22; text-align: center;
    box-shadow: 0 18px 50px rgba(20, 8, 45, .45), 0 3px 10px rgba(20, 8, 45, .25);
    transform-origin: var(--tail, 50%) 100%; will-change: transform, opacity;
  }
  .bubble::after {                       /* хвостик к говорящему */
    content: ''; position: absolute; left: calc(var(--tail, 50%) - 22px); bottom: -17px;
    width: 44px; height: 44px; background: inherit; border-radius: 10px; transform: rotate(45deg);
  }
  .bubble .rest { color: transparent; }  /* ещё не напечатанный хвост текста держит размер облачка */
  .bubble.soft { background: rgba(255, 255, 255, .78); }
  .bubble.dots { padding: 22px 40px 30px; font-size: 72px; line-height: .8; letter-spacing: 10px; }
  .bubble.dots span { opacity: 0; }

  #final {
    position: absolute; left: 50%; top: 38%; width: 940px; transform: translate(-50%, -50%);
    opacity: 0; text-align: center; color: #fff6fb; font-weight: 900; font-size: 92px; line-height: 1.18;
    text-shadow: 0 0 34px rgba(255, 190, 225, .8), 0 0 90px rgba(255, 160, 210, .45), 0 8px 30px rgba(30, 10, 60, .6);
  }
  #fade { position: absolute; inset: 0; background: #03040f; opacity: 1; pointer-events: none; }
  #replay {
    position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%);
    display: none; cursor: pointer; border: 0; border-radius: 999px; padding: 30px 72px;
    font: 800 54px/1 'Nunito', system-ui, sans-serif; color: #3d2860;
    background: linear-gradient(135deg, #ffd6e8, #d8c6ff); box-shadow: 0 16px 50px rgba(255, 170, 215, .45);
  }
  #replay:hover { filter: brightness(1.06); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",

<body>
<div id="stage">

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ═════════════════════════════════════════════════════════════════════
 *  1. ТЕКСТЫ И ТАЙМИНГИ — всё, что обычно хочется поменять, здесь
 * ═════════════════════════════════════════════════════════════════════ */
const LINES = [
  { who: 'nata', at: 2.5,  text: 'Оля, привет!' },
  { who: 'olya', at: 5.3,  text: 'Привет-привет!' },
  { who: 'nata', at: 8.3,  text: 'Прости, что я опять такая косячная…', mood: 'sad' },
  { who: 'nata', at: 15.2, text: 'Мне очень стыдно, что я создаю тебе проблемы…', mood: 'sad' },
  { who: 'nata', at: 21.9, text: 'Моя дорогая Олечка… Я тебя очень-очень люблю!' },
  { who: 'nata', at: 26.9, text: 'До луны и обратно!' },
  { who: 'nata', at: 35.8, text: 'Мне так ценны минуты, когда ты рядом…', mood: 'soft' },
];
const THINK_DOTS_AT = 12.7;               // Оля задумалась: «…», точки по одной
const FINAL_TEXT = 'Спасибо, что ты рядом 🌙❤️';

// Начала сцен, секунды
const T = {
  hi1: 2.0,       // Ната робко машет
  hi2: 5.0,       // Оля подпрыгивает
  sorry: 8.1,     // крупный план Наты: «прости…»
  think: 12.3,    // крупный план Оли: задумалась
  shame: 15.0,    // Ната сникает, слезинка
  comfort: 19.5,  // средний план: Оля качает головой, шаг ближе
  love: 21.7,     // признание, лапки к груди
  moon: 26.8,     // «До луны и обратно!», сердечко летит к луне
  hug: 30.6,      // Оля раскрывает лапки, Ната бежит, объятие
  quiet: 34.6,    // минуты тишины: смотрят на луну, машинка рядом
  outro: 40.0,    // камера отъезжает, финальная надпись
  end: 43.6,      // конец
};
const TYPE_SPEED = 18;   // букв в секунду
const HOLD_AFTER = 2.0;  // реплика висит после допечатывания, с

/* ═════════════════════════════════════════════════════════════════════
 *  2. УТИЛИТЫ: easing, ключевые кадры, детерминированный random, пружина
 * ═════════════════════════════════════════════════════════════════════ */
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const TAU = Math.PI * 2;
const EASE = {
  lin: k => k,
  sine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  back: k => { const c1 = 2.0, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  elastic: k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -9 * k) * Math.sin((k * 9 - .75) * TAU / 3) + 1,
};
// Ключевые кадры: [[время, значение, easing к этому ключу], ...]. Значение — число или массив.
// easing 'cut' — монтажная склейка: предыдущее значение держится до времени ключа.
function keys(t, ks) {
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) {
    const [t1, v1, e = 'sine'] = ks[i];
    if (t < t1) {
      const [t0, v0] = ks[i - 1];
      if (e === 'cut') return v0;
      const k = EASE[e]((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => a + (v1[j] - a) * k) : v0 + (v1 - v0) * k;
    }
  }
  return ks[ks.length - 1][1];
}
// «Окно»: плавно 0→1 на [a, a+fin], держится, 1→0 на [b-fout, b]
const env = (t, a, b, fin = .3, fout = .3) => Math.min(sstep(a, a + fin, t), 1 - sstep(b - fout, b, t));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
// Follow-through без состояния: отклик затухающей пружины на ускорение fn(t) (свёртка по прошлому).
// Поэтому любой кадр можно посчитать отдельно, и рендер детерминирован.
function spring(fn, t, hz = 2.2, zeta = .22, win = 1.2, n = 24) {
  const w = TAU * hz, wd = w * Math.sqrt(1 - zeta * zeta), dt = win / n, f = [];
  for (let k = -1; k <= n + 1; k++) f.push(fn(t - k * dt));
  let x = 0;
  for (let i = 0; i <= n; i++) {
    const a = (f[i] - 2 * f[i + 1] + f[i + 2]) / (dt * dt);
    x += Math.exp(-zeta * w * i * dt) * Math.sin(wd * i * dt) / wd * a * dt;
  }
  return -x;
}
// Прыжок: anticipation → stretch в полёте → squash при приземлении. Возвращает [высота, squash]
function hopAt(t, t0, h, dur, ant = .16) {
  const a = t - t0;
  if (a < 0 || a > ant + dur + .8) return [0, 0];
  const amt = clamp(.45 + h, .5, 1.1);
  if (a < ant) return [0, -.13 * EASE.sine(a / ant) * amt];
  const b = a - ant;
  if (b < dur) {
    const k = b / dur;
    return [4 * h * k * (1 - k), lerp(-.13, .15 * Math.abs(Math.cos(Math.PI * k)), sstep(0, .14, k)) * amt];
  }
  const c = b - dur, m = sstep(0, .05, c);
  return [0, lerp(.15, -.18 * Math.exp(-6 * c) * Math.cos(13 * c), m) * amt];
}
const hops = (t, list) => list.reduce((s, h) => { const r = hopAt(t, ...h); s[0] += r[0]; s[1] += r[1]; return s; }, [0, 0]);
const lineEnd = l => l.at + l.text.length / TYPE_SPEED;

// Производные тайминги
const RUN = { start: T.hug + .4, step: .43, n: 3 };
const MERGE = RUN.start + RUN.n * RUN.step;                       // момент объятия
const HEART = { launch: T.moon + .6 }; HEART.atMoon = HEART.launch + 1.35; HEART.back = HEART.atMoon + .6; HEART.land = HEART.back + 1.3;
const MOON_POS = new THREE.Vector3(12, 30, -100), MOON_R = 7.5;
const MOON_YAW = Math.atan2(MOON_POS.x, MOON_POS.z);             // куда смотреть, чтобы видеть луну

/* ═════════════════════════════════════════════════════════════════════
 *  3. РЕНДЕР, КАМЕРА, СВЕТ, ПОСТ-ОБРАБОТКА
 * ═════════════════════════════════════════════════════════════════════ */
const params = new URLSearchParams(location.search);
const RENDER_MODE = params.has('render');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // в r18x это мягкие PCF-тени (PCFSoftShadowMap удалён); мягкость — shadow.radius

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x3a2a5c, .012);
const camera = new THREE.PerspectiveCamera(38, W / H, .1, 1000);

// Окружение для отражений (глаза, лак машинки, сердечки)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .32;

// Свет: тёплый ключевой «от луны», холодный заполняющий, контровой для силуэтов меха
const hemi = new THREE.HemisphereLight(0x7d6fc4, 0x2a1d3a, .9);
const key = new THREE.DirectionalLight(0xffd6b0, 2.0);
key.position.set(4.5, 7.5, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: .5, far: 40 });
key.shadow.bias = -.0004; key.shadow.normalBias = .03; key.shadow.radius = 5;
const fill = new THREE.DirectionalLight(0x8fa4ff, .75); fill.position.set(-7, 2.5, 5);
const rim = new THREE.DirectionalLight(0xffc4e4, 2.6); rim.position.set(5, 6, -10);
scene.add(hemi, key, key.target, fill, rim);

// Общие uniforms шейдера меха (одни объекты на всех — обновляются раз за кадр)
const SHARED = {
  uTime: { value: 0 }, uCamPos: { value: new THREE.Vector3() },
  uKeyDir: { value: new THREE.Vector3() }, uKeyCol: { value: new THREE.Color() },
  uFillDir: { value: new THREE.Vector3() }, uFillCol: { value: new THREE.Color() },
  uRimDir: { value: new THREE.Vector3() }, uRimCol: { value: new THREE.Color() },
  uSkyCol: { value: new THREE.Color() }, uGroundCol: { value: new THREE.Color() },
  uFogCol: { value: new THREE.Color() }, uFogDen: { value: .012 },
};

// Пост-обработка: рендер (MSAA 4x, HDR) → глубина резкости → bloom → тонмаппинг → виньетка + зерно
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 10, aperture: .0004, maxblur: .009 });
composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), .7, .55, .9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uVig: { value: .38 }, uGrain: { value: .05 }, uRes: { value: new THREE.Vector2(W, H) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uVig, uGrain; uniform vec2 uRes; varying vec2 vUv;
    float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - .5; q.y *= 1.2;
      c.rgb *= mix(1.0 - uVig, 1.0, smoothstep(.78, .22, length(q)));
      float g = hash(floor(vUv * uRes) + floor(fract(uTime * .731) * 997.0)) - .5;
      c.rgb += g * uGrain * (1.0 - .6 * c.rgb);
      gl_FragColor = c;
    }`,
});
composer.addPass(finalPass);

// Объекты, которые не участвуют в проходе глубины для боке (частицы, спрайты, оболочки меха)
const NO_DEPTH = [];
const bokehRender = bokeh.render.bind(bokeh);
bokeh.render = (...a) => {
  NO_DEPTH.forEach(o => { o.userData.v = o.visible; o.visible = false; });
  bokehRender(...a);
  NO_DEPTH.forEach(o => { o.visible = o.userData.v; });
};

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
labelRenderer.setSize(W, H);

/* ═════════════════════════════════════════════════════════════════════
 *  4. ОКРУЖЕНИЕ: небо, звёзды, луна, холм, трава, туман
 * ═════════════════════════════════════════════════════════════════════ */
const R0 = rng(7);
const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const radialTex = canvasTex(128, 128, (g, w) => { const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); });

const skyRoot = new THREE.Group(); scene.add(skyRoot);   // небо и звёзды «на бесконечности» — следуют за камерой
const skyMat = new THREE.ShaderMaterial({
  uniforms: { uTop: { value: new THREE.Color() }, uMid: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
              uMoonDir: { value: MOON_POS.clone().normalize() }, uGlow: { value: new THREE.Color(0xffd9a8) }, uGlowAmt: { value: 1 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: `
    uniform vec3 uTop, uMid, uHor, uMoonDir, uGlow; uniform float uGlowAmt; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 c = mix(uHor, uMid, smoothstep(-.04, .26, h));
      c = mix(c, uTop, smoothstep(.2, .78, h));
      float m = max(dot(d, uMoonDir), 0.0);
      c += uGlow * uGlowAmt * (pow(m, 40.0) * .16 + pow(m, 400.0) * .55);
      c = mix(c, uHor * .5, smoothstep(0.0, -.3, h));
      gl_FragColor = vec4(c, 1.0);
    }`,
  side: THREE.BackSide, depthWrite: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 32), skyMat);
sky.renderOrder = -10; skyRoot.add(sky); NO_DEPTH.push(sky);

// Звёзды: частицы с мерцанием в шейдере
const STAR_N = 1600;
{
  const pos = new Float32Array(STAR_N * 3), size = new Float32Array(STAR_N), ph = new Float32Array(STAR_N), br = new Float32Array(STAR_N);
  for (let i = 0; i < STAR_N; i++) {
    const u = R0() * TAU, y = Math.pow(R0(), .8) * .98 + .02, r = Math.sqrt(1 - y * y);
    pos.set([Math.cos(u) * r * 420, y * 420, Math.sin(u) * r * 420], i * 3);
    size[i] = 1.5 + Math.pow(R0(), 3) * 5.5; ph[i] = R0() * TAU; br[i] = .35 + Math.pow(R0(), 2) * 1.6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  g.setAttribute('aBright', new THREE.BufferAttribute(br, 1));
  var starMat = new THREE.ShaderMaterial({
    uniforms: { uTime: SHARED.uTime, uPR: { value: 1 }, uAmt: { value: 1 } },
    vertexShader: `
      uniform float uTime, uPR, uAmt; attribute float aSize, aPhase, aBright; varying float vB;
      void main(){
        vB = aBright * uAmt * (.55 + .45 * sin(uTime * (1.2 + fract(aPhase * 3.7) * 2.5) + aPhase));
        vB *= smoothstep(.02, .2, normalize(position).y);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPR;
      }`,
    fragmentShader: `varying float vB; void main(){ float d = length(gl_PointCoord - .5); float a = smoothstep(.5, 0.0, d); a *= a; gl_FragColor = vec4(vec3(1.0, .93, .97) * vB * a, 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  });
  const stars = new THREE.Points(g, starMat); stars.frustumCulled = false; skyRoot.add(stars); NO_DEPTH.push(stars);
}

// Луна: мягкое лицо (спокойное → улыбка), сильное свечение
const moonMap = canvasTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#fff0c4'; g.fillRect(0, 0, w, h);
  const r = rng(3);
  for (let i = 0; i < 70; i++) {
    const x = r() * w, y = 60 + r() * (h - 120), s = 6 + Math.pow(r(), 2) * 46;
    const gr = g.createRadialGradient(x, y, 0, x, y, s); gr.addColorStop(0, 'rgba(214,176,112,.45)'); gr.addColorStop(1, 'rgba(214,176,112,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill();
  }
});
const face = (smile) => canvasTex(1024, 512, (g) => {
  const cx = 256, cy = 256;
  g.lineCap = 'round'; g.strokeStyle = 'rgba(140,86,40,1)'; g.lineWidth = 13;
  // закрытые глазки-дуги
  [[-52, -18], [52, -18]].forEach(([dx, dy]) => { g.beginPath(); g.arc(cx + dx, cy + dy + (smile ? 10 : 0), 22, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); });
  g.beginPath();
  if (smile) g.arc(cx, cy + 22, 42, Math.PI * .15, Math.PI * .85); else g.arc(cx, cy + 34, 18, Math.PI * .2, Math.PI * .8);
  g.stroke();
  g.fillStyle = smile ? 'rgba(245,150,150,.75)' : 'rgba(245,160,150,.4)';
  [[-92, 30], [92, 30]].forEach(([dx, dy]) => { g.beginPath(); g.ellipse(cx + dx, cy + dy, 26, 15, 0, 0, TAU); g.fill(); });
});
const moonMat = new THREE.ShaderMaterial({

/* ═════════════════════════════════════════════════════════════════════
 *  5. МЕХ: shell texturing — N оболочек (инстансы), шум задаёт ворсинки
 * ═════════════════════════════════════════════════════════════════════ */
const FUR_VS = `
  uniform float uLen, uLayers, uTime, uFluff, uGravity, uFaceShort, uSeed;
  uniform vec3 uWind, uFaceDir;
  varying float vH; varying vec3 vRoot, vWN, vWP;
  void main(){
    float h = float(gl_InstanceID) / (uLayers - 1.0);
    vec3 n = normalize(normal);
    float face = smoothstep(.70, .93, dot(n, uFaceDir));
    float len = uLen * uFluff * mix(1.0, uFaceShort, face);
    vec3 p = position + n * len * h;
    vec3 sway = vec3(sin(uTime * 1.9 + position.y * 4.0 + uSeed), 0.0, cos(uTime * 1.5 + position.x * 4.0 + uSeed)) * .2;
    vec3 g = vec3(0.0, -uGravity, 0.0) + uWind + sway;
    g -= n * dot(g, n) * .6;                 // ворс изгибается вдоль поверхности
    p += g * len * h * h;
    vRoot = position; vH = h;
    vec4 wp = modelMatrix * vec4(p, 1.0);
    vWP = wp.xyz; vWN = normalize(mat3(modelMatrix) * n);
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const FUR_FS = `
  uniform vec3 uRoot, uTip, uKeyDir, uKeyCol, uFillDir, uFillCol, uRimDir, uRimCol, uSkyCol, uGroundCol, uFogCol, uCamPos;
  uniform float uDensity, uSeed, uFogDen, uBright;
  varying float vH; varying vec3 vRoot, vWN, vWP;
  vec3 hash33(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
  // одна ворсинка на ячейку 3D-сетки: сужается к кончику, длина случайная
  vec2 strand(vec3 q, float h){
    vec3 cell = floor(q), f = fract(q), rn = hash33(cell);
    float len = .45 + .55 * rn.z;
    float hh = h / len;
    if (hh > 1.0) return vec2(0.0, rn.z);
    float d = length(f - (rn * .5 + .25));
    float thick = .62 * (1.0 - hh) + .04;
    return vec2(1.0 - smoothstep(thick - .1, thick + .02, d), rn.z);
  }
  void main(){
    vec3 q = vRoot * uDensity + uSeed;
    vec2 s1 = strand(q, vH), s2 = strand(q + 17.5, vH);
    float cov = max(s1.x, s2.x), rnd = s1.x > s2.x ? s1.y : s2.y;
    if (vH < .001) cov = 1.0;
    if (cov < .02) discard;
    vec3 N = normalize(vWN), V = normalize(uCamPos - vWP);
    vec3 base = mix(uRoot, uTip, smoothstep(0.0, 1.0, vH)) * (.86 + .28 * rnd);
    float ao = mix(.5, 1.0, smoothstep(0.0, .9, vH));                        // самозатенение у корней
    float kd = clamp(dot(N, uKeyDir) * .55 + .45, 0.0, 1.0);                  // мягкий wrap-диффуз
    float fd = clamp(dot(N, uFillDir) * .5 + .5, 0.0, 1.0);
    vec3 amb = mix(uGroundCol, uSkyCol, N.y * .5 + .5);
    vec3 col = base * (amb + uKeyCol * kd + uFillCol * fd * .6) * ao * .55;
    float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.2);
    float rl = clamp(dot(N, uRimDir) * .5 + .5, 0.0, 1.0);
    col += (uRimCol * .7 + base * uRimCol * .5) * fres * (.2 + .8 * rl) * (.3 + .7 * vH) * .3;  // просвечивание по краю
    vec3 Hh = normalize(uKeyDir + V);
    col += uKeyCol * pow(clamp(dot(N, Hh), 0.0, 1.0), 20.0) * .05 * vH;      // шелковистый блик
    col *= uBright;

  }`;
function furMesh(geo, o) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      ...SHARED,
      uRoot: { value: new THREE.Color(o.root) }, uTip: { value: new THREE.Color(o.tip) },
      uLen: { value: o.len }, uLayers: { value: o.layers }, uDensity: { value: o.density }, uSeed: { value: o.seed || 0 },
      uFaceDir: { value: (o.faceDir || new THREE.Vector3(0, 0, 1)).clone().normalize() }, uFaceShort: { value: o.faceShort ?? 1 },
      uFluff: { value: 1 }, uWind: { value: new THREE.Vector3() }, uGravity: { value: o.gravity ?? .35 }, uBright: { value: 1 },
    },
    vertexShader: FUR_VS, fragmentShader: FUR_FS, alphaToCoverage: true,
  });

  const id = new THREE.Matrix4(); for (let i = 0; i < o.layers; i++) mesh.setMatrixAt(i, id);
  mesh.frustumCulled = false; NO_DEPTH.push(mesh);

}

function makeFluffy(c) {
  const R = 1;
  const root = new THREE.Group(), hop = new THREE.Group(), squash = new THREE.Group(), lean = new THREE.Group(), body = new THREE.Group();
  root.add(hop); hop.add(squash); squash.add(lean); lean.add(body); body.position.y = R + .12; scene.add(root);
  lean.rotation.order = 'YXZ';

  // ножки-лапки: бархат с sheen

  const feet = [-1, 1].map(s => {
    const f = new THREE.Mesh(new THREE.SphereGeometry(.26, 24, 16), footMat);
    f.scale.set(1, .55, 1.3); f.position.set(s * .42, .13, .28); f.castShadow = true; squash.add(f); return f;
  });

    eye.add(new THREE.Mesh(new THREE.SphereGeometry(ER, 40, 28), scleraMat));
    const iris = new THREE.Group(); eye.add(iris);
    const ir = new THREE.Mesh(new THREE.SphereGeometry(ER * 1.006, 40, 16, 0, TAU, 0, 1.32), irisMat); ir.rotation.x = Math.PI / 2; iris.add(ir);
    const pu = new THREE.Mesh(new THREE.SphereGeometry(ER * 1.012, 32, 8, 0, TAU, 0, .62), pupilMat); pu.rotation.x = Math.PI / 2; iris.add(pu);
    const glints = new THREE.Group(); eye.add(glints);
    [[-.34, .4, .055], [.3, -.28, .028]].forEach(([x, y, r]) => {
      const g = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), glintMat);
      const d = new THREE.Vector3(x, y, .82).normalize(); g.position.copy(onSphere(d, ER * 1.01)); orientOut(g, d); g.scale.z = .35; glints.add(g);
    });
    const lid = new THREE.Mesh(new THREE.SphereGeometry(ER * 1.06, 40, 20, 0, TAU, 0, Math.PI / 2), lidMat); eye.add(lid);
    const happy = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(new THREE.Vector3(-.17, -.04, 0), new THREE.Vector3(0, .1, 0), new THREE.Vector3(.17, -.04, 0)), 20, .024, 8), inkMat);

    const dir = new THREE.Vector3(s * .36, .42, .84).normalize();
    const g = new THREE.Group(); g.position.copy(onSphere(dir, 1.1)); orientOut(g, dir); body.add(g);
    const b = new THREE.Mesh(new THREE.CapsuleGeometry(.024, .13, 4, 8), inkMat); b.rotation.z = Math.PI / 2; g.add(b);

  });

  // ротик: улыбка-линия (переворачивается в грустную) + открытый ротик для речи
  const mouthDir = new THREE.Vector3(0, -.26, .96).normalize();
  const mouth = new THREE.Group(); mouth.position.copy(onSphere(mouthDir, 1.065)); orientOut(mouth, mouthDir); body.add(mouth);
  const smile = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(new THREE.Vector3(-.1, .02, 0), new THREE.Vector3(0, -.06, 0), new THREE.Vector3(.1, .02, 0)), 16, .018, 8), inkMat);
  mouth.add(smile);

  const om = new THREE.Mesh(new THREE.SphereGeometry(.075, 24, 16), new THREE.MeshStandardMaterial({ color: 0x6e1f3a, roughness: .5 })); om.scale.set(1, 1, .45); open.add(om);
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(.045, 16, 12), new THREE.MeshStandardMaterial({ color: 0xff7f9f, roughness: .5 })); tongue.position.set(0, -.035, .02); tongue.scale.set(1, .6, .5); open.add(tongue);

  });

  // слезинка
  const tear = new THREE.Mesh(new THREE.SphereGeometry(.05, 24, 16), new THREE.MeshPhysicalMaterial({ color: 0xd4ecff, emissive: 0x8fc6ff, emissiveIntensity: .7, roughness: .02, clearcoat: 1, transparent: true, opacity: .9 }));
  tear.scale.set(1, 1.4, .7); tear.visible = false; body.add(tear);

  // ручки: пушистые капсулы на шарнире-плече
  const arms = [-1, 1].map(s => {
    const pivot = new THREE.Group(); pivot.position.set(s * .8, -.1, .3); pivot.rotation.order = 'YZX'; body.add(pivot);

    const d = new THREE.Vector3(.42, .86, .18).normalize();

  const anchor = new THREE.Object3D(); anchor.position.set(0, R + (c.tuft ? .62 : .5), 0); body.add(anchor);

  return { c, root, hop, squash, lean, body, feet, fur, eyes, brows, smile, open, cheeks, cheekMat, tear, arms, topper, anchor, topperRot: topper.rotation.clone() };
}

function pose(who, t) {

function applyPose(ch, who, p, t) {

  ch.body.scale.set(1 - p.breath * .5, 1 + p.breath, 1 - p.breath * .5);
  // лицо
  const lid = p.happy > .5 ? 1 : Math.max(p.lid, p.blink);

  else ch.topper.rotation.set(ch.topperRot.x + sy2 * 1.1 + p.droop * .4, 0, ch.topperRot.z - sx2 * .9 - p.droop * .3);

  if (B.typed) {                                        // облачко появляется вместе с первой буквой
    const n = Math.min(B.l.text.length, Math.floor(a * TYPE_SPEED) + 1);
    if (n !== B.n) { B.typed.textContent = B.l.text.slice(0, n); B.rest.textContent = B.l.text.slice(n); B.n = n; }
  } else B.dots.forEach((d, i) => { d.style.opacity = clamp((a - i * .6) / .2); });
  const hk = clamp((t - B.hide) / .35);
  B.s = popScale(a, B.l.mood) * (1 - .08 * hk);
  B.o = (B.l.mood === 'sad' || B.l.mood === 'soft' ? EASE.sine(clamp(a / .45)) : clamp(a / .1)) * (1 - hk) * (B.l.mood === 'soft' ? .85 : 1);
}
function placeBubble(B) {                               // держим облачко в кадре, хвостик — к говорящему
  if (!B.obj.visible) return;
  const v = _v.setFromMatrixPosition(B.obj.matrixWorld).project(camera);
  const off = v.z > 1 || Math.abs(v.x) > 1.08 || v.y > 1.15 || v.y < -1.05;
  B.el.style.visibility = off ? 'hidden' : 'visible';
  if (off) return;
  const sx = (v.x + 1) / 2 * W, sy = (1 - v.y) / 2 * H, bw = B.el.offsetWidth, bh = B.el.offsetHeight, M = 36;
  const left = clamp(sx - bw / 2, M, W - M - bw), top = sy - 34 - bh, dy = top < M ? M - top : 0;
  const tail = clamp(sx - left, 52, bw - 52);
  B.el.style.setProperty('--tail', tail + 'px');
  B.el.style.transform = `translate(${left - sx}px, ${dy}px) scale(${B.s})`;
  B.el.style.opacity = B.o;
}

/* ═════════════════════════════════════════════════════════════════════
 *  10. КАДР: renderFrame(t) выставляет ВСЮ сцену на момент t и рисует её
 * ═════════════════════════════════════════════════════════════════════ */
const COL = { top0: new THREE.Color(0x070a28), top1: new THREE.Color(0x0e1236), mid0: new THREE.Color(0x1f1a4e), mid1: new THREE.Color(0x3d2869),
              hor0: new THREE.Color(0x8a5a88), hor1: new THREE.Color(0xe38d9c), key0: new THREE.Color(0xe8d0c0), key1: new THREE.Color(0xffc48f),
              sky0: new THREE.Color(0x6b61b0), sky1: new THREE.Color(0xa47bbf) };
const tc = new THREE.Color();
const finalEl = document.getElementById('final'), fadeEl = document.getElementById('fade');
finalEl.textContent = FINAL_TEXT;

function updateCar(t) {
  // путь: кубическая кривая Безье — машинка разворачивается по дуге и встаёт рядом с героями
  const k = EASE.inOut(clamp((t - CAR.roll0) / (CAR.roll1 - CAR.roll0))), u = 1 - k;
  const P = [CAR.p0, CAR.c1, CAR.c2, CAR.p1];
  const at = i => u * u * u * P[0][i] + 3 * u * u * k * P[1][i] + 3 * u * k * k * P[2][i] + k * k * k * P[3][i];
  const d = i => 3 * u * u * (P[1][i] - P[0][i]) + 6 * u * k * (P[2][i] - P[1][i]) + 3 * k * k * (P[3][i] - P[2][i]);
  const x = at(0), z = at(1);
  let pathYaw = Math.atan2(d(0), d(1)); if (pathYaw < -1) pathYaw += TAU;   // без скачка через ±π
  car.root.position.set(x, hill(x, z), z);
  car.root.rotation.y = lerp(CAR.yaw0, pathYaw, sstep(0, .2, k));
  const dist = k * CAR.len; car.wheels.forEach(w => { w.rotation.x = dist / .3; });
  // покачивание, смущённое ёрзанье, лёгкий подскок при езде
  const shy = env(t, T.sorry + .6, T.sorry + 1.6, .1, .2);
  car.rock.rotation.set(.012 * Math.sin(t * 2.1), .07 * Math.sin(t * 22) * shy, .02 * Math.sin(t * 1.7) + .03 * Math.sin(t * 9) * (k > 0 && k < 1 ? 1 : 0));
  car.rock.position.y = .012 * Math.sin(t * 3.4) + (k > 0 && k < 1 ? .02 * Math.abs(Math.sin(t * 11)) : 0);
  // моргание фарами
  let blink = 0;
  for (const b of [1.3, 6.4, T.sorry + .6, T.sorry + .95, 17.2, 24.8, T.hug + 1.2]) { const a = t - b; if (a >= 0 && a < .24) blink = Math.max(blink, a < .1 ? a / .1 : 1 - (a - .1) / .14); }
  const glowK = keys(t, [[0, 1], [CAR.roll1 - .2, 1], [CAR.roll1 + .8, 2]]);
  car.lamps.forEach(L => { L.lid.rotation.x = lerp(-1.25, 1.55, blink); L.glow.material.opacity = .45 * glowK * (1 - blink); L.glow.scale.setScalar(.9 + .5 * (glowK - 1)); });
  car.lampMat.emissiveIntensity = 2.2 * glowK;
  car.light.intensity = 6 * (glowK - 1);
}

function renderFrame(t) {
  t = clamp(t, 0, T.end);
  SHARED.uTime.value = t;
  const warm = keys(t, [[0, 0], [MERGE, 0], [T.quiet + 1.5, 1]]);   // настроение: холодно → тепло
  // небо, луна, свет
  skyMat.uniforms.uTop.value.lerpColors(COL.top0, COL.top1, warm);
  skyMat.uniforms.uMid.value.lerpColors(COL.mid0, COL.mid1, warm);
  skyMat.uniforms.uHor.value.lerpColors(COL.hor0, COL.hor1, warm);
  skyMat.uniforms.uGlowAmt.value = .8 + .7 * warm;
  starMat.uniforms.uAmt.value = 1 + .35 * warm;
  moonMat.uniforms.uBright.value = .9 + .12 * warm + .1 * env(t, HEART.atMoon - .1, HEART.back + .6, .2, .5);
  moonMat.uniforms.uSmile.value = sstep(HEART.atMoon, HEART.atMoon + .5, t);
  const squish = env(t, HEART.atMoon, HEART.atMoon + .7, .12, .5) * Math.sin((t - HEART.atMoon) * 18);
  moon.scale.set(1 + .06 * squish, 1 - .06 * squish, 1);
  moonGlow.material.opacity = .26 + .14 * warm + .12 * env(t, HEART.atMoon - .1, HEART.back + .6, .2, .5);
  const silhouette = sstep(T.quiet + .5, T.quiet + 2, t);
  key.color.lerpColors(COL.key0, COL.key1, warm); key.intensity = lerp(1.8, 2.5, warm) * (1 - .5 * silhouette);
  rim.intensity = 2.6 * (1 + .7 * silhouette);
  hemi.color.lerpColors(COL.sky0, COL.sky1, warm);
  renderer.toneMappingExposure = lerp(.92, 1.05, warm);
  scene.fog.color.copy(skyMat.uniforms.uHor.value).lerp(skyMat.uniforms.uMid.value, .5).multiplyScalar(.6);
  finalPass.uniforms.uTime.value = t; finalPass.uniforms.uVig.value = lerp(.4, .28, warm);
  fogSprites.forEach(s => { const d = s.userData; s.position.set(((d.x0 + t * d.sp) + 13) % 26 - 13, d.y, d.z); });
  // герои, машинка, эффекты
  const pn = pose('nata', t), po = pose('olya', t);
  applyPose(nata, 'nata', pn, t); applyPose(olya, 'olya', po, t);
  updateCar(t);
  updateHearts(t);
  // летящее сердечко
  const hv = heartVisible(t);
  flyHeart.visible = flyGlow.visible = hv;
  if (hv) {
    const p = heartPos(t);
    let s = .28 * (1 + p.distanceTo(camera.position) / 7);
    s *= t < HEART.launch + .3 ? EASE.back((t - HEART.launch) / .3) : 1;
    s *= 1 - sstep(HEART.atMoon - .15, HEART.atMoon, t) * (1 - sstep(HEART.back, HEART.back + .3, t));
    s *= 1 + sstep(HEART.land, HEART.land + .45, t) * 1.5;
    flyHeart.position.copy(p); flyHeart.scale.setScalar(Math.max(.001, s)); flyHeart.rotation.set(0, t * 3, .2 * Math.sin(t * 4));
    flyGlow.position.copy(p); flyGlow.scale.setScalar(s * 3.2); flyGlow.material.opacity = .9 * (1 - sstep(HEART.land, HEART.land + .45, t));
  }
  // вспышка объятия
  const fl = env(t, MERGE, MERGE + 1.6, .15, 1.2);
  const hx = (pn.x + po.x) / 2;
  flash.position.set(hx, 1.6, .6); flash.scale.setScalar(2 + 3.5 * fl); flash.material.opacity = .28 * fl;
  flashLight.position.set(hx, 1.8, 1.2); flashLight.intensity = 6 * fl;
  // камера и свет для меха
  skyRoot.position.copy(camera.position);
  updateCamera(t);
  skyRoot.position.copy(camera.position);
  updateParticles(t, warm);
  SHARED.uCamPos.value.copy(camera.position);
  const L = (light, dirU, colU, k = 1) => { dirU.value.copy(light.position).sub(light.target.position).normalize(); colU.value.copy(light.color).multiplyScalar(light.intensity * k); };
  L(key, SHARED.uKeyDir, SHARED.uKeyCol); L(fill, SHARED.uFillDir, SHARED.uFillCol); L(rim, SHARED.uRimDir, SHARED.uRimCol);
  SHARED.uSkyCol.value.copy(hemi.color).multiplyScalar(hemi.intensity); SHARED.uGroundCol.value.copy(hemi.groundColor).multiplyScalar(hemi.intensity);
  SHARED.uFogCol.value.copy(scene.fog.color); SHARED.uFogDen.value = scene.fog.density;
  // облачка
  BUBBLES.forEach(b => updateBubble(b, t)); updateBubble(DOTS, t);
  // рисуем
  composer.render();
  labelRenderer.render(scene, camera);
  BUBBLES.forEach(placeBubble); placeBubble(DOTS);
  // финальная надпись и затемнения
  const fk = sstep(T.outro + 1.0, T.outro + 2.2, t);
  finalEl.style.opacity = fk; finalEl.style.transform = `translate(-50%, -50%) scale(${lerp(.94, 1, EASE.out(fk))})`;
  fadeEl.style.opacity = Math.max(1 - sstep(.1, 1.9, t), sstep(T.end - 1.3, T.end, t));
}

/* ═════════════════════════════════════════════════════════════════════
 *  11. ЗАПУСК: масштаб под окно, просмотр в реальном времени, API для render.py
 * ═════════════════════════════════════════════════════════════════════ */
function setQuality(pr) {
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr); composer.setSize(W, H);
  starMat.uniforms.uPR.value = pr; [sparks, fireflies, dust].forEach(p => { p.material.uniforms.uPR.value = pr; });
}
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
  if (!RENDER_MODE) setQuality(clamp(s * devicePixelRatio, .5, 1));
}
if (RENDER_MODE) setQuality(1); else { addEventListener('resize', fit); fit(); }

// начальные и конечные точки полёта сердечка берём из поз героев
function pointAt(who, t, obj) { applyPose(CH[who], who, pose(who, t), t); CH[who].root.updateMatrixWorld(true); return obj().getWorldPosition(new THREE.Vector3()); }
H0 = pointAt('nata', HEART.launch, () => nata.arms[1].paw);
HO = pointAt('olya', HEART.land, () => olya.body).add(new THREE.Vector3(0, -.1, 1.15));
initHeartEvents();

const ready = (async () => {
  try { await document.fonts.load('800 52px Nunito'); await document.fonts.ready; } catch (e) { /* шрифт не обязателен */ }
  renderFrame(0);
  return T.end;
})();
window.__ready = ready;
window.DURATION = T.end;
window.renderFrame = renderFrame;

const replay = document.getElementById('replay');
if (!RENDER_MODE) {
  const from = parseFloat(params.get('t') || params.get('from') || 0);
  let start = 0, still = params.has('t');
  const loop = now => {
    const t = still ? from : from + (now - start) / 1000;
    renderFrame(t);
    if (t >= T.end) { replay.style.display = 'block'; return; }
    if (!still) requestAnimationFrame(loop);
  };
  replay.onclick = () => { replay.style.display = 'none'; start = performance.now(); still = false; requestAnimationFrame(n => { start = n; loop(n); }); };
  ready.then(() => requestAnimationFrame(n => { start = n; loop(n); }));
}
</script>
