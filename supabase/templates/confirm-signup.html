<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Подтвердите почту — Будет на ЕГЭ</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 0;
        background: #f2f7fe;
        color: #101728;
        font-family: Arial, Helvetica, sans-serif;
      }
      a {
        color: #1a4fb0;
      }
      .outer {
        width: 100%;
        background: #f2f7fe;
        padding: 32px 12px;
      }
      .card {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #d7e5fa;
        border-radius: 20px;
      }
      .content {
        padding: 32px;
      }
      .brand {
        margin: 0 0 24px;
        color: #1a4fb0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 0 0 16px;
        color: #0b1f45;
        font-size: 26px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 16px;
        color: #3b4658;
        font-size: 16px;
        line-height: 1.5;
      }
      .button-wrap {
        padding: 8px 0 24px;
      }
      .button {
        display: inline-block;
        min-width: 220px;
        padding: 16px 24px;
        border-radius: 12px;
        background: #1a4fb0;
        color: #fff !important;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
        text-decoration: none;
      }
      .fine {
        padding-top: 20px;
        border-top: 1px solid #e4ebf3;
        color: #667389;
        font-size: 14px;
      }
      @media (max-width: 480px) {
        .outer {
          padding: 12px 8px;
        }
        .card {
          border-radius: 16px;
        }
        .content {
          padding: 24px 20px;
        }
        h1 {
          font-size: 23px;
        }
        .button {
          display: block;
          min-width: 0;
        }
      }
      @media (prefers-color-scheme: dark) {
        body,
        .outer {
          background: #101728 !important;
        }
        .card {
          background: #18243a !important;
          border-color: #3b4d68 !important;
        }
        h1 {
          color: #f5f9ff !important;
        }
        p {
          color: #e4ebf3 !important;
        }
        .brand,
        a {
          color: #9bc0f2 !important;
        }
        .button {
          background: #3d79e0 !important;
          color: #fff !important;
        }
        .fine {
          border-color: #3b4d68 !important;
          color: #cfdae8 !important;
        }
      }
    </style>
  </head>
  <body>
    <table
      class="outer"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
    >
      <tr>
        <td align="center">
          <table
            class="card"
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
          >
            <tr>
              <td class="content">
                <p class="brand">БУДЕТ НА ЕГЭ</p>
                <h1>Подтвердите почту</h1>
                <p>Чтобы завершить регистрацию, нажмите кнопку:</p>
                <div class="button-wrap">
                  <a class="button" href="{{ .ConfirmationURL }}"
                    >Подтвердить почту</a
                  >
                </div>
                <p class="fine">
                  Если вы не регистрировались — просто удалите это письмо.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
