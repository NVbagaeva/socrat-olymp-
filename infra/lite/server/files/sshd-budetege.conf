# Файл читается раньше 50-cloud-init.conf, а в sshd побеждает первое
# значение — поэтому пароль, включённый образом провайдера, здесь
# выключается надёжно.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers deploy tunnel
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
