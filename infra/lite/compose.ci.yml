# Только для проверки в CI (workflow lite-server.yml): машина GitHub
# играет роль сервера. Письма ловит Mailpit, копии принимает S3-сервер
# rclone вместо Yandex Object Storage. Оба порта — только на 127.0.0.1.
# На настоящем сервере этот файл не используется.

services:
  mailpit:
    image: axllent/mailpit:v1.31.5
    mem_limit: 64m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - 127.0.0.1:8025:8025
      - 127.0.0.1:1025:1025

  s3:
    image: rclone/rclone:1.75.2
    mem_limit: 128m
    command: [serve, s3, --addr, ':9000', --auth-key, '${S3_ACCESS_KEY_ID},${S3_SECRET_ACCESS_KEY}', /data]
    volumes:
      - s3-data:/data
    ports:
      - 127.0.0.1:9000:9000

  auth:
    depends_on:
      mailpit: { condition: service_started }

volumes:
  s3-data:
