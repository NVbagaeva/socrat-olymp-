<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- тело: лазурное, темнее к центру-верху, светлеет к нижнему краю -->
    <radialGradient id="gb-body" cx="45%" cy="38%" r="68%">
      <stop offset="0%"   stop-color="#2A64DB"/>
      <stop offset="45%"  stop-color="#2D72E8"/>
      <stop offset="75%"  stop-color="#3C93F5"/>
      <stop offset="100%" stop-color="#5CB8FF"/>
    </radialGradient>
    <!-- свет, проходящий сквозь низ шара -->
    <radialGradient id="gb-refract" cx="55%" cy="95%" r="55%">
      <stop offset="0%"   stop-color="#A8ECFF" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#6CCBFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6CCBFF" stop-opacity="0"/>
    </radialGradient>
    <!-- мягкий блик сверху -->
    <radialGradient id="gb-sheen" cx="40%" cy="20%" r="45%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- ободок: яркая дуга сверху-слева и голубая снизу -->
    <linearGradient id="gb-rim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="35%"  stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="70%"  stop-color="#8FDCFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B8F0FF" stop-opacity="0.95"/>
    </linearGradient>
    <!-- столбики: белые, к основанию уходят в голубой -->
    <linearGradient id="gb-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CFE9FF" stop-opacity="0.7"/>
    </linearGradient>
    <!-- голубое свечение вокруг -->
    <radialGradient id="gb-halo" cx="50%" cy="55%" r="50%">
      <stop offset="72%"  stop-color="#4FB0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4FB0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="gb-blur-s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="gb-blur-m" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="gb-clip"><circle cx="80" cy="80" r="52"/></clipPath>
  </defs>

  <circle cx="80" cy="84" r="64" fill="url(#gb-halo)"/>
  <circle cx="80" cy="80" r="52" fill="url(#gb-body)"/>

  <g clip-path="url(#gb-clip)">
    <ellipse cx="82" cy="116" rx="52" ry="30" fill="url(#gb-refract)" filter="url(#gb-blur-m)"/>
    <ellipse cx="70" cy="42" rx="38" ry="22" fill="url(#gb-sheen)" filter="url(#gb-blur-m)"/>

    <!-- лёгкая тень под глифом -->
    <g fill="#1B4DB8" opacity="0.25" filter="url(#gb-blur-s)" transform="translate(1,2)">
      <rect x="60" y="80" width="5.5" height="18" rx="2.75"/>
      <rect x="72" y="58" width="5.5" height="40" rx="2.75"/>
      <rect x="84" y="70" width="5.5" height="28" rx="2.75"/>
      <rect x="96" y="84" width="5.5" height="14" rx="2.75"/>
    </g>
    <!-- глиф: тонкие полупрозрачные столбики -->
    <g fill="url(#gb-bar)">
      <rect x="60" y="80" width="5.5" height="18" rx="2.75"/>
      <rect x="72" y="58" width="5.5" height="40" rx="2.75"/>
      <rect x="84" y="70" width="5.5" height="28" rx="2.75"/>
      <rect x="96" y="84" width="5.5" height="14" rx="2.75"/>
    </g>
    <rect x="52" y="100" width="58" height="4" rx="2" fill="#FFFFFF" opacity="0.65"/>
  </g>
  <path d="M42,62 A52,52 0 0 1 100,32" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.22" filter="url(#gb-blur-s)" clip-path="url(#gb-clip)"/>
  <circle cx="80" cy="80" r="51.2" fill="none" stroke="url(#gb-rim)" stroke-width="1.6"/>
</svg>
