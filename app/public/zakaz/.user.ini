; Лимиты PHP для обработчика заявок (PHP-FPM читает этот файл).
; docs/SERVICE TEACHERS LANDING.md, §9.3.
upload_max_filesize = 25M
post_max_size = 30M
; 11, а не 10: лишний файл PHP отбросил бы молча, а так обработчик
; видит его и отвечает понятной ошибкой «больше 10 файлов».
max_file_uploads = 11
max_execution_time = 60
memory_limit = 256M
display_errors = Off
