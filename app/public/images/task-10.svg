<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 280 280" width="280" height="280" role="img" aria-label="Траектория мяча: высота h от времени t — парабола от h₀ через вершину">
  <!-- h(t) = h0 + v t − g t²/2: точная парабола (одна квадратичная кривая Безье),
       мяч на высоте h0 при t = 0, вершина (142, 74), приземление x ≈ 250.
       Пунктир от вершины к оси t — момент, когда мяч выше всего.
       Стиль — как у task-01.svg: линии #0c3ebc, заливка #c3dffa, лёгкая заливка
       #7FAEEA. Фона нет — его даёт плашка или шапка раздела. -->
  <defs>
    <linearGradient id="t10-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FAEEA" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7FAEEA" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="t10-sun">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#ff9a3c" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="t10-shar" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3dffa"/>
      <stop offset="1" stop-color="#7FAEEA"/>
    </radialGradient>
    <filter id="t10-ten" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0c3ebc" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 182 Q151.9 -58.3 249.8 236 L249.8 236 L54 236 Z" fill="url(#t10-g)" stroke="none"/>
    <path d="M38 236 H278 M54 252 V36" stroke-width="1.5"/>
    <path d="M270.1 240.3 L278 236 L270.1 231.7" stroke-width="1.5"/>
    <path d="M58.3 43.9 L54 36 L49.7 43.9" stroke-width="1.5"/>
    <path d="M142 83 V236" stroke-width="1.3" stroke-dasharray="4 5"/>
    <path d="M142 231 V241" stroke-width="1.5"/>
    <path d="M54 182 Q151.9 -58.3 249.8 236" stroke-width="2.5"/>
    <path d="M76 146.7 L76 134.8 L65.9 141.3 Z" fill="#0c3ebc" stroke-width="2.5"/>
  </g>
  <circle cx="142" cy="74" r="28" fill="url(#t10-sun)"/>
  <g fill="#0c3ebc" stroke="#fff" stroke-width="1.6">
    <circle cx="98" cy="101" r="5"/>
    <circle cx="196" cy="114.7" r="5"/>
  </g>
  <circle cx="142" cy="74" r="6.5" fill="#f08a24" stroke="#fff" stroke-width="2"/>
  <g filter="url(#t10-ten)">
    <circle cx="54" cy="182" r="13" fill="url(#t10-shar)" stroke="#0c3ebc" stroke-width="1.8"/>
  </g>
  <ellipse cx="50" cy="177" rx="5" ry="3" fill="#fff" fill-opacity="0.9" transform="rotate(-35 50 177)"/>
  <g fill="#0c3ebc" font-family="'Times New Roman', 'Cambria Math', 'DejaVu Serif', serif" font-style="italic" font-size="19">
    <text x="64" y="44">h</text>
    <text x="270" y="259" text-anchor="middle">t</text>
    <text x="35" y="188" text-anchor="end">h<tspan font-size="13" dy="4">0</tspan></text>
  </g>
</svg>
