<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 270 270" width="270" height="270" role="img" aria-label="Тригонометрическая окружность с отмеченными точками">
  <!-- Окружность R = 100 с центром (150,150). Отмечены точки 30°, 150°
       и 270°; сектор между 30° и 150° залит, пунктир — проекция на ось sin.
       Стиль — как у task-01.svg: линии #0c3ebc, заливка #c3dffa,
       лёгкая заливка #7FAEEA с прозрачностью 0.12, обводка 1.5–2, точки r 5–6.
       Фона нет — его даёт плашка карточки. -->

  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">
    <!-- оси -->
    <path d="M32 150 H 268 M150 268 V 32" stroke-width="1.5"/>
    <path d="M259 154.95 L268 150 L259 145.05" stroke-width="1.5"/>
    <path d="M154.95 41 L150 32 L145.05 41" stroke-width="1.5"/>
    <!-- окружность -->
    <circle cx="150" cy="150" r="100" fill="#7FAEEA" fill-opacity="0.12" stroke-width="2"/>
    <!-- сектор между отмеченными точками -->
    <path d="M150 150 L236.6 100 A100 100 0 0 0 63.4 100 Z" fill="#c3dffa" fill-opacity="0.8" stroke-width="2"/>
    <!-- проекция на ось sin: обе точки на высоте 1/2 -->
    <path d="M63.4 100 H 236.6" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="M150 150 L150 250" stroke-width="1.5" stroke-dasharray="6 5"/>
  </g>
  <g fill="#0c3ebc">
    <circle cx="236.6" cy="100" r="6"/>
    <circle cx="63.4" cy="100" r="6"/>
    <circle cx="150" cy="250" r="6"/>
    <circle cx="150" cy="150" r="4"/>
    <circle cx="150" cy="100" r="4"/>
  </g>
</svg>
