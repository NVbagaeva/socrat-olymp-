<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 270 270" width="270" height="270" role="img" aria-label="Три варианта-тарифа, выгодный отмечен галочкой">
  <!-- Выбор оптимального варианта: три карточки, у лучшей — галочка.
       Стиль — как у task-01.svg: линии #0c3ebc, заливка #c3dffa, лёгкая заливка
       #7FAEEA. Фона нет — его даёт плашка или шапка раздела. -->
  <defs>
    <linearGradient id="b-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FAEEA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7FAEEA" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="120" width="64" height="120" rx="10" fill="#c3dffa" fill-opacity="0.55" stroke-width="1.8"/>
    <path d="M54 146 H90 M54 162 H80" stroke-width="2"/>
    <rect x="116" y="90" width="64" height="150" rx="10" fill="url(#b-g)" fill-opacity="1" stroke-width="2.6"/>
    <path d="M130 116 H166 M130 132 H156" stroke-width="2"/>
    <rect x="192" y="140" width="64" height="100" rx="10" fill="#c3dffa" fill-opacity="0.55" stroke-width="1.8"/>
    <path d="M206 166 H242 M206 182 H232" stroke-width="2"/>
    <circle cx="148" cy="62" r="22" fill="#fff" stroke-width="2.2"/>
    <path d="M137 62 L145 71 L160 53" stroke-width="3"/>
  </g>
</svg>
