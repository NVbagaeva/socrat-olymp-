<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Inter, Arial, sans-serif" font-size="17">
  <title>Обгон поезда в одном направлении</title>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5bd3"/>
    </marker>
    <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#ffffff"/>

  <!-- ── Начало обгона ── -->
  <text x="16" y="24" font-weight="700" fill="#1f2937">Начало: голова пассажирского у хвоста товарного</text>
  <line x1="16" y1="70" x2="624" y2="70" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="16" y1="112" x2="624" y2="112" stroke="#cbd5e1" stroke-width="2"/>
  <!-- пассажирский: хвост 80, голова 200 -->
  <rect x="80" y="44" width="120" height="22" rx="5" fill="#dbe6ff" stroke="#2f5bd3" stroke-width="2"/>
  <path d="M200 44 l14 11 l-14 11 z" fill="#2f5bd3"/>
  <text x="140" y="60" text-anchor="middle" fill="#1e3a8a" font-weight="600">x</text>
  <!-- товарный: хвост 200, голова 440 -->
  <rect x="200" y="86" width="240" height="22" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <path d="M440 86 l14 11 l-14 11 z" fill="#6b7280"/>
  <text x="320" y="102" text-anchor="middle" fill="#374151" font-weight="600">товарный</text>
  <line x1="200" y1="36" x2="200" y2="118" stroke="#2f5bd3" stroke-dasharray="4 3"/>
  <line x1="470" y1="97" x2="510" y2="97" stroke="#6b7280" stroke-width="2" marker-end="url(#hg)"/>
  <line x1="230" y1="55" x2="270" y2="55" stroke="#2f5bd3" stroke-width="2" marker-end="url(#h)"/>

  <!-- ── Конец обгона ── -->
  <text x="16" y="164" font-weight="700" fill="#1f2937">Конец: хвост пассажирского у головы товарного</text>
  <line x1="16" y1="210" x2="624" y2="210" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="16" y1="252" x2="624" y2="252" stroke="#cbd5e1" stroke-width="2"/>
  <!-- пассажирский сместился относительно товарного на x + L: хвост 440, голова 560 -->
  <rect x="440" y="184" width="120" height="22" rx="5" fill="#dbe6ff" stroke="#2f5bd3" stroke-width="2"/>
  <path d="M560 184 l14 11 l-14 11 z" fill="#2f5bd3"/>
  <text x="500" y="200" text-anchor="middle" fill="#1e3a8a" font-weight="600">x</text>
  <rect x="200" y="226" width="240" height="22" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <path d="M440 226 l14 11 l-14 11 z" fill="#6b7280"/>
  <text x="320" y="242" text-anchor="middle" fill="#374151" font-weight="600">товарный</text>
  <line x1="200" y1="176" x2="200" y2="262" stroke="#2f5bd3" stroke-dasharray="4 3"/>
  <line x1="560" y1="176" x2="560" y2="262" stroke="#2f5bd3" stroke-dasharray="4 3"/>

  <!-- смещение головы пассажирского относительно товарного -->
  <line x1="202" y1="282" x2="558" y2="282" stroke="#2f5bd3" stroke-width="2" marker-start="url(#h)" marker-end="url(#h)"/>
  <text x="320" y="276" text-anchor="middle" fill="#6b7280">длина товарного</text>
  <text x="500" y="276" text-anchor="middle" fill="#6b7280">x</text>
  <line x1="440" y1="270" x2="440" y2="290" stroke="#2f5bd3" stroke-width="1.5"/>
  <text x="320" y="314" text-anchor="middle" fill="#1e3a8a" font-weight="700">пассажирский сместился на x + длина товарного</text>
</svg>
