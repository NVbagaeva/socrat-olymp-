<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 270 270" width="270" height="270" role="img" aria-label="График функции с касательной в точке и площадью под графиком">
  <!-- Задание №9: производная и первообразная.
       Кривая y = 0,32 + 2,25 / (1 + e^(−2,1(x − 1,45))), начало координат
       в (66, 232), 56 px в единице, кривая — сплайн по 27 точкам.
       Касательная в x₀ = 2,2 посчитана по производной (k ≈ 0.671): касается
       кривой ровно в отмеченной точке и на всём отрезке лежит выше неё.
       Залита площадь под графиком от оси y до x₀ (первообразная),
       пунктир — абсцисса точки касания.
       Стиль — как у task-01.svg и task-14.svg: линии #0c3ebc, заливка
       #c3dffa, обводка 1.5–2.5, точки r 4–6; касательная — терракотовая
       #e07a2f (акцент сайта). Фона нет — его даёт плашка. -->

  <!-- площадь под графиком -->
  <path d="M66 232 H189.2 V109.69 C187.73 110.78 183.33 113.85 180.4 116.25 C177.47 118.65 174.53 121.29 171.6 124.11 C168.67 126.93 165.73 130 162.8 133.16 C159.87 136.32 156.93 139.71 154 143.09 C151.07 146.47 148.13 150.01 145.2 153.44 C142.27 156.87 139.33 160.37 136.4 163.67 C133.47 166.97 130.53 170.22 127.6 173.24 C124.67 176.26 121.73 179.14 118.8 181.78 C115.87 184.41 112.93 186.85 110 189.06 C107.07 191.26 104.13 193.24 101.2 195.03 C98.27 196.81 95.33 198.37 92.4 199.77 C89.47 201.18 86.53 202.37 83.6 203.46 C80.67 204.54 77.73 205.44 74.8 206.26 C71.87 207.07 67.47 208.01 66 208.36 Z" fill="#c3dffa" fill-opacity="0.85"/>

  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">
    <!-- оси со стрелками -->
    <path d="M34 232 H268 M66 264 V34" stroke-width="1.5"/>
    <path d="M259 236.95 L268 232 L259 227.05" stroke-width="1.5"/>
    <path d="M70.95 43 L66 34 L61.05 43" stroke-width="1.5"/>
    <!-- абсцисса точки касания -->
    <path d="M189.2 118.69 V232" stroke-width="1.5" stroke-dasharray="6 5"/>
    <!-- касательная — терракотовая, акцент сайта, терракотовый -->
    <path d="M138.8 143.53 L245.2 72.09" stroke="#e07a2f" stroke-width="2.25"/>
    <!-- график функции -->
    <path d="M35.2 212.22 C36.63 212.1 40.9 211.8 43.75 211.53 C46.6 211.26 49.45 210.96 52.3 210.59 C55.15 210.22 58 209.82 60.85 209.32 C63.7 208.83 66.55 208.28 69.4 207.62 C72.25 206.95 75.1 206.22 77.95 205.34 C80.8 204.46 83.65 203.49 86.5 202.35 C89.35 201.2 92.21 199.93 95.06 198.46 C97.91 196.99 100.76 195.36 103.61 193.52 C106.46 191.68 109.31 189.64 112.16 187.39 C115.01 185.15 117.86 182.68 120.71 180.03 C123.56 177.38 126.41 174.5 129.26 171.51 C132.11 168.51 134.96 165.3 137.81 162.06 C140.66 158.82 143.51 155.41 146.36 152.07 C149.21 148.73 152.06 145.31 154.91 142.03 C157.76 138.76 160.61 135.5 163.46 132.44 C166.31 129.39 169.16 126.44 172.01 123.72 C174.86 121 177.71 118.44 180.56 116.12 C183.41 113.79 186.26 111.67 189.11 109.75 C191.96 107.83 194.81 106.12 197.66 104.58 C200.51 103.04 203.37 101.71 206.22 100.5 C209.07 99.3 211.92 98.27 214.77 97.34 C217.62 96.42 220.47 95.64 223.32 94.94 C226.17 94.24 229.02 93.66 231.87 93.13 C234.72 92.61 237.57 92.18 240.42 91.79 C243.27 91.4 246.12 91.08 248.97 90.79 C251.82 90.51 256.09 90.18 257.52 90.06" stroke-width="2.5"/>
  </g>

  <!-- точка касания и x₀ на оси -->
  <g fill="#0c3ebc">
    <circle cx="189.2" cy="109.69" r="6.5" stroke="#ffffff" stroke-width="2.5" paint-order="stroke"/>
    <circle cx="189.2" cy="232" r="4"/>
  </g>
</svg>
