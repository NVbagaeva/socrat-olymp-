<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 270 270" width="270" height="270" role="img" aria-label="Разносторонний треугольник с вписанной окружностью">
  <!-- Треугольник (40,235), (262,235), (100,58) — разносторонний, чтобы
       не повторять равносторонний чертёж №01. Центр вписанной окружности
       (124.47, 174.44), r = 60.56; точки касания — основания
       перпендикуляров из центра, к ним пунктиром радиусы.
       Стиль — как у task-01.svg: линии #0c3ebc, заливка #c3dffa,
       лёгкая заливка #7FAEEA с прозрачностью 0.12, обводка 1.5–2, точки r 5–6.
       Фона нет — его даёт плашка карточки. -->

  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">
    <!-- треугольник -->
    <polygon points="40,235 262,235 100,58" fill="#7FAEEA" fill-opacity="0.12" stroke-width="2"/>
    <!-- вписанная окружность -->
    <circle cx="124.47" cy="174.44" r="60.56" fill="#c3dffa" stroke-width="2"/>
    <!-- радиусы в точки касания -->
    <g stroke-width="1.5" stroke-dasharray="6 5">
      <line x1="124.47" y1="174.44" x2="124.47" y2="235"/>
      <line x1="124.47" y1="174.44" x2="169.15" y2="133.55"/>
      <line x1="124.47" y1="174.44" x2="67.12" y2="155"/>
    </g>
  </g>
  <g fill="#0c3ebc">
    <circle cx="40" cy="235" r="6"/>
    <circle cx="262" cy="235" r="6"/>
    <circle cx="100" cy="58" r="6"/>
    <circle cx="124.47" cy="235" r="4"/>
    <circle cx="169.15" cy="133.55" r="4"/>
    <circle cx="67.12" cy="155" r="4"/>
    <circle cx="124.47" cy="174.44" r="5"/>
  </g>
</svg>
