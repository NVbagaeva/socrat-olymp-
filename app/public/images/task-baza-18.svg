    </linearGradient>
  </defs>
  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">
    <path d="M94 150 H206 V124 H94 Z" fill="url(#b-g)" stroke="none"/>
    <path d="M100 150 l18 -24 M113 150 l18 -24 M126 150 l18 -24 M139 150 l18 -24 M152 150 l18 -24 M165 150 l18 -24 M178 150 l18 -24 M191 150 l18 -24" stroke-width="1.5" stroke-opacity="0.75"/>
    <path d="M64 144 V156 M236 144 V156" stroke-width="1.5"/>
    <path d="M32 150 H268" stroke-width="2"/>
    <path d="M259.2 154.8 L268 150 L259.2 145.2" stroke-width="2"/>
    <path d="M150 144 V156" stroke-width="1.5"/>
    <path d="M94 150 H206" stroke-width="4"/>
