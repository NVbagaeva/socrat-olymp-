<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 270 270" width="270" height="270" role="img" aria-label="Знак корня над клеткой и клетка со степенью">
  <!-- Преобразования: корень и степень — выражение упрощается.
       Стиль — как у task-01.svg: линии #0c3ebc, заливка #c3dffa, лёгкая заливка
       #7FAEEA. Фона нет — его даёт плашка или шапка раздела. -->
  <defs>
    <linearGradient id="b-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FAEEA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7FAEEA" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 160 L50 152 L70 210 L98 86 H172" stroke-width="3"/>
    <rect x="108" y="108" width="58" height="76" rx="10" fill="url(#b-g)" stroke-width="2"/>
    <path d="M186 140 H208 M186 154 H208" stroke-width="2.8"/>
    <rect x="222" y="116" width="40" height="62" rx="9" fill="#c3dffa" stroke-width="2"/>
    <rect x="266" y="96" width="16" height="20" rx="5" fill="#7FAEEA" fill-opacity="0.65" stroke-width="1.8"/>
  </g>
</svg>
