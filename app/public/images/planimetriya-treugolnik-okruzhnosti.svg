<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Равносторонний треугольник с вписанной и описанной окружностями" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Геометрия: центр (150,150), R = 110, r = R/2 = 55.
       Вершины на углах 90°, 210°, 330°:
       (150, 40), (54.74, 205), (245.26, 205).
       Вписанная окружность касается сторон в их серединах. -->

  <g fill="none" stroke="#1F5FD0" stroke-linecap="round" stroke-linejoin="round">

    <!-- описанная окружность -->
    <circle cx="150" cy="150" r="110" stroke-width="1.5" opacity="0.55"/>

    <!-- треугольник -->
    <polygon points="150,40 245.26,205 54.74,205"
             fill="#1F5FD0" fill-opacity="0.12"
             stroke-width="3"/>

    <!-- вписанная окружность -->
    <circle cx="150" cy="150" r="55"
            fill="#1F5FD0" fill-opacity="0.10"
            stroke-width="1.5" opacity="0.75"/>

    <!-- радиусы: центр к вершинам -->
    <g stroke-width="1.5" stroke-dasharray="7 6" opacity="0.7">
      <line x1="150" y1="150" x2="150" y2="40"/>
      <line x1="150" y1="150" x2="54.74" y2="205"/>
      <line x1="150" y1="150" x2="245.26" y2="205"/>
    </g>

  </g>

  <!-- точки: вершины и центр -->
  <g fill="#1F5FD0">
    <circle cx="150" cy="40" r="8"/>
    <circle cx="54.74" cy="205" r="8"/>
    <circle cx="245.26" cy="205" r="8"/>
    <circle cx="150" cy="150" r="7"/>
  </g>
</svg>
