  <clipPath id="clipwall"><path d="M730,368 L610,368 L610,320 L730,320 L730,248 L490,248 L490,200 L778,200 L778,608 L730,608 Z M490,440 L490,368 L250,368 L250,200 L298,200 L298,320 L538,320 L538,440 L658,440 L658,608 L130,608 L130,320 L178,320 L178,560 L610,560 L610,488 L250,488 L250,440 Z M418,80 L418,248 L370,248 L370,128 L130,128 L130,80 Z M490,80 L778,80 L778,128 L490,128 Z M178,200 L178,248 L130,248 L130,200 Z" clip-rule="evenodd"/></clipPath>
  <symbol id="star" overflow="visible">
    <g fill="#fff3d6" filter="url(#glow)">
      <path d="M0,-11 L2,-2 L11,0 L2,2 L0,11 L-2,2 L-11,0 L-2,-2 Z" fill="#fff8e8"/>
      <circle r="2.2" fill="#ffd28a"/>
    </g>
  </symbol>
  <symbol id="spider" overflow="visible">
    <g stroke="#ff9a2e" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#glow)"><path d="M0,0 q-7.0,-8.5 -14,-9" /><path d="M0,0 q-7.5,-5.0 -15,-2" /><path d="M0,0 q-7.0,-1.0 -14,6" /><path d="M0,0 q-5.5,2.0 -11,12" /><path d="M0,0 q7.0,-8.5 14,-9" /><path d="M0,0 q7.5,-5.0 15,-2" /><path d="M0,0 q7.0,-1.0 14,6" /><path d="M0,0 q5.5,2.0 11,12" /></g>
    <ellipse rx="7.5" ry="8.5" fill="#ff8c1a" filter="url(#glow)"/>
    <ellipse cx="-1" cy="-3" rx="3" ry="3.2" fill="#ffe0b0" opacity="0.8"/>
    <circle cy="-11" r="4" fill="#ff8c1a" filter="url(#glow)"/>
  </symbol>
</defs>

