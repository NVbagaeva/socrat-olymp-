<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 270 270" width="270" height="270" role="img" aria-label="Равносторонний треугольник с вписанной и описанной окружностями">
  <!-- Геометрия: центр (150,150), R = 110, r = R/2 = 55.
       Вершины: (150, 40), (245.26, 205), (54.74, 205).
       Вписанная окружность касается сторон в их серединах.
       Координаты считались на холсте 300×300; viewBox обрезан до 270,
       чтобы фигура занимала 81 % стороны, как у соседних миниатюр.
       Цвета и толщины сняты с растров карточек 02–04: линии #0c3ebc,
       заливка #c3dffa, обводка 2 ≈ 3,4 px в растре 512.
       Фона нет — его даёт плашка карточки. -->

  <g fill="none" stroke="#0c3ebc" stroke-linecap="round" stroke-linejoin="round">

    <!-- описанная окружность -->
    <circle cx="150" cy="150" r="110" stroke-width="1.5"/>

    <!-- треугольник -->
    <polygon points="150,40 245.26,205 54.74,205"
             fill="#c3dffa"
             stroke-width="2"/>

    <!-- вписанная окружность -->
    <circle cx="150" cy="150" r="55"
            fill="#7FAEEA" fill-opacity="0.12"
            stroke-width="1.5"/>

    <!-- радиусы: центр к вершинам -->
    <g stroke-width="1.5" stroke-dasharray="6 5">
      <line x1="150" y1="150" x2="150" y2="40"/>
      <line x1="150" y1="150" x2="54.74" y2="205"/>
      <line x1="150" y1="150" x2="245.26" y2="205"/>
    </g>

  </g>

  <!-- точки: вершины и центр -->
  <g fill="#0c3ebc">
    <circle cx="150" cy="40" r="6"/>
    <circle cx="54.74" cy="205" r="6"/>
    <circle cx="245.26" cy="205" r="6"/>
    <circle cx="150" cy="150" r="5"/>
  </g>
</svg>
